 return lt=>{c.forEach((e,k)=>{e.style.opacity=p(lt,k?a+k*.2:.05,.1);e.style.transform=`scale(${lerp(1.5,1,eob(p(lt,k?a+k*.2:.05,.3)))})`});c[1].style.scale=lt>a+.6?1+.03*Math.sin(lt*8):1}};
