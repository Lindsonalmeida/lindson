<style>

*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:var(--navy);font-family:'Barlow Condensed'}

.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 2px,transparent 2px 4px);pointer-events:none}

.lower{position:absolute;left:60px;right:60px;top:1180px}
.lower .t1{display:inline-block;background:var(--red);color:#fff;font:800 40px 'Barlow Condensed';padding:8px 22px;letter-spacing:.08em}
.lower .t2{background:#fff;color:var(--navy);font:400 70px/1.05 Anton;padding:18px 24px;text-transform:uppercase}
.ticker{position:absolute;left:0;right:0;top:1440px;height:78px;background:var(--yel);overflow:hidden;display:flex;align-items:center}
.ticker .lb{background:var(--navy);color:var(--yel);height:100%;display:flex;align-items:center;padding:0 22px;font:800 34px 'Barlow Condensed';z-index:2;letter-spacing:.06em}
.ticker .tx{white-space:nowrap;font:700 40px 'Barlow Condensed';color:var(--navy);padding-left:30px}
.cap{position:absolute;left:60px;right:60px;top:1580px;text-align:center;font:700 62px/1.15 'Barlow Condensed';color:#fff}
.cap span{display:inline-block;margin:0 .12em}.cap span.on{color:var(--yel)}
.logo{position:absolute;top:70px;left:60px;display:flex;align-items:center;gap:14px;font:400 56px Anton;color:#fff;letter-spacing:.02em}
.logo b{background:var(--red);padding:2px 16px;border-radius:6px;font-weight:400}
.clock{position:absolute;top:84px;right:60px;font:700 40px 'Barlow Condensed';color:#fff;opacity:.85}
.bub{position:absolute;padding:24px 30px;border-radius:26px;font:600 40px/1.2 'Barlow Condensed';max-width:620px}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none}
</style></head><body><div id="st"></div>
