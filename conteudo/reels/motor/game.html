<style>
:root{--bg:#1B0B3A;--mg:#FF2E88;--cy:#2DE2E6;--ye:#FFD319;--gr:#3DFF6E}

<script>const TL=__TL__;</script><script src="file:///home/user/lindson/conteudo/reels/motor/core.js"></script>

 const pl=player();pl.style.left='90px';pl.style.top='800px';pl.style.width='200px';pl.style.height='300px';pl.style.top='890px';L.append(pl);const bs=L.querySelector('.bs');const a=s.vs0+s.vd*.4;sfx(s.s+.05,'buzz');sfx(s.s+a,'stampbig');
 return lt=>{draw(pl);bs.style.transform=`translateY(${lerp(-1100,0,eo(p(lt,.05,.5)))}px) scale(${lt>a&&lt<a+.3?1.08:1})`;const sh=lt>a&&lt<a+.35?14:0;L.style.translate=`${Math.sin(lt*90)*sh}px 0`}};

 const go=L.querySelector('.go'),fm=L.querySelector('.fm');sfx(s.s+.1,'gameover');

 <div class="abs it" style="left:300px;top:480px;width:480px;background:#fff;color:#000;border:10px solid #000;box-shadow:12px 12px 0 var(--cy);padding:26px;text-align:center;font-size:34px;line-height:1.6">ANUNCIO<br><span style="color:var(--mg)">PERTO + WHATSAPP</span></div>

 const j=s.vs0+s.vd*.3,g=j+.55;sfx(s.s+j,'jump');sfx(s.s+j+.25,'coin');sfx(s.s+g,'powerup');
 return lt=>{draw(pl);const jy=lt>j&&lt<j+.5?Math.sin((lt-j)/.5*Math.PI)*-180:0;pl.style.translate=`0 ${jy}px`;bk.style.translate=`0 ${lt>j+.22&&lt<j+.32?-30:0}px`;
  it.style.opacity=lt>j+.25?1:0;it.style.transform=`translateY(${lerp(0,-170,eo(p(lt,j+.25,.4)))}px)`;pu.style.opacity=lt>g?1:0;
  pl.style.filter=lt>g?`hue-rotate(${(lt*720)%360}deg) saturate(2) drop-shadow(0 0 30px var(--ye))`:''}};

 <div class="abs cnt" style="left:0;right:0;top:470px;text-align:center;font-size:60px;color:var(--ye)">💬 x00</div>
 ${[...Array(8)].map((_,i)=>`<div class="abs cn" style="left:${520+(i%4)*110}px;top:880px;font-size:70px">💬</div>`).join('')}
 <div class="abs aj" style="left:0;right:0;top:650px;text-align:center;font-size:40px;color:var(--gr)">AJUSTE SEMANAL +1 LV</div><div class="floor"></div>`;
 const pl=player();pl.style.left='120px';pl.style.top='800px';L.append(pl);const cn=[...L.querySelectorAll('.cn')],cnt=L.querySelector('.cnt'),bh=L.querySelector('.bh'),aj=L.querySelector('.aj');
 const ts=cn.map((_,i)=>s.vs0+.2+i*s.vd*.07);ts.forEach(a=>sfx(s.s+a,'coin'));const aa=s.vs0+s.vd*.6;sfx(s.s+aa,'powerup');
 return lt=>{draw(pl);let n=0;cn.forEach((e,i)=>{const k=p(lt,ts[i],.35);if(lt>ts[i]+.35)n++;e.style.opacity=lt<ts[i]?1:1-k;e.style.transform=`translate(${lerp(0,-(520+(i%4)*110)+480,eo(k))}px,${lerp(0,-400,eo(k))-Math.sin(k*Math.PI)*120}px)`});

 <div class="abs cd" style="left:0;right:0;top:470px;text-align:center;font-size:150px">9</div>
 <div class="abs o1" style="left:120px;right:120px;top:740px;background:#25D366;border:8px solid #fff;padding:34px;font-size:40px;line-height:1.6;text-align:center;box-shadow:12px 12px 0 #000">▶ SIM<br>ME CHAMA NO WHATSAPP</div>

 const cd=L.querySelector('.cd'),o1=L.querySelector('.o1');const a=s.vs0+s.vd*.45;sfx(s.s+a,'coin');[0,1,2,3].forEach(k=>sfx(s.s+.1+k,'blip'));
 return lt=>{cd.textContent=Math.max(1,9-Math.floor(lt));o1.style.transform=`scale(${lt>a?1+.04*Math.sin(lt*8):.0001+eob(p(lt,.2,.3))})`;o1.style.opacity=p(lt,.2,.1)}};

boot(st,B,(t,i,lt)=>{caption(dlg.firstChild,t,i);document.getElementById('arw').style.opacity=blink(t);
 const sc=Math.max(0,Math.floor(segs.filter((s,k)=>k<i).length*1250+lt*90));hud.querySelector('.sc').textContent=String(sc).padStart(6,'0');
 const L=document.querySelectorAll('.layer')[i];L.style.clipPath=`inset(${lerp(50,0,eo(p(lt,0,.18)))}% 0)`});
st.append(hud,dlg);segs.forEach((s,i)=>{if(i)sfx(s.s,'blip')});
</script></body></html>
