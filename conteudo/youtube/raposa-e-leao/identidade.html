<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Raposa e Leão — identidade</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Anton&display=swap" rel="stylesheet">
<style>
:root{--noite:#0B0A08;--carvao:#17140F;--ouro:#C9A227;--ouro2:#E2BE4A;--brasa:#D9622B;--perg:#EFE6D2;--sangue:#8E1B1B}
*{margin:0;box-sizing:border-box}
body{background:#333;display:flex;flex-direction:column;gap:40px;padding:40px;align-items:flex-start}
.p{position:relative;overflow:hidden;background:var(--noite);color:var(--perg)}
.grao:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(0,0,0,.65));pointer-events:none}
/* perfil */
#perfil{width:800px;height:800px;border-radius:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#2a2115,var(--noite) 70%)}
#perfil svg{width:640px;height:640px}
/* banner 2560x1440, área segura 1546x423 central */
#banner{width:2560px;height:1440px;background:radial-gradient(ellipse at 50% 50%,#251c11,var(--noite) 60%)}
#banner .faixa{position:absolute;left:0;right:0;top:508px;height:423px;display:flex;align-items:center;justify-content:center;gap:56px}
#banner svg{width:360px;height:360px;flex:none}
#banner h1{font:900 132px/1 Cinzel;letter-spacing:.06em;color:var(--perg)}
#banner h1 i{font-style:normal;color:var(--ouro)}
#banner p{font:italic 500 46px/1.25 'Cormorant Garamond';color:#cdbf9f;margin-top:18px}
#banner small{display:block;font:700 26px Cinzel;letter-spacing:.32em;color:var(--brasa);margin-top:22px}
#banner .linhas{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 159px,rgba(201,162,39,.05) 159px 160px)}
/* thumbs */
.th{width:1280px;height:720px;background:var(--noite)}
.th .foto{position:absolute;right:-40px;top:0;width:640px;height:720px;background:url(img/maquiavel.jpg) center 18%/cover;filter:grayscale(1) contrast(1.15) brightness(.9);-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%)}
.th .brilho{position:absolute;right:120px;top:120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(217,98,43,.45),transparent 65%);mix-blend-mode:screen}
.th .txt{position:absolute;left:64px;top:70px;width:720px}
.th h2{font:400 128px/.92 Anton;text-transform:uppercase;color:var(--perg);letter-spacing:.005em}
.th h2 b{font-weight:400;color:var(--ouro2)}
.th h2 em{font-style:normal;background:var(--sangue);padding:0 .12em;display:inline-block;line-height:.98}
.th .tag{display:inline-block;font:700 26px Cinzel;letter-spacing:.2em;color:var(--noite);background:var(--ouro);padding:10px 20px;margin-bottom:26px}
.th .selo{position:absolute;left:64px;bottom:44px;display:flex;align-items:center;gap:14px;font:700 26px Cinzel;letter-spacing:.14em;color:#cdbf9f}
.th .selo svg{width:64px;height:64px}
.th.b .foto{right:auto;left:-40px;-webkit-mask-image:linear-gradient(270deg,transparent,#000 35%);background-position:center 18%}
.th.b .brilho{right:auto;left:120px;background:radial-gradient(circle,rgba(201,162,39,.4),transparent 65%)}
.th.b .txt{left:auto;right:64px;text-align:right}
.th.b .selo{left:auto;right:64px}
.th .num{position:absolute;font:400 520px/1 Anton;color:rgba(201,162,39,.12);left:20px;top:60px}
</style></head><body>

<svg width="0" height="0" style="position:absolute"><defs>

 <polygon points="200,240 252,252 268,280 226,300 200,305" fill="#D4B04A"/>
 <polygon points="252,252 300,222 290,268 268,280" fill="#A8841C"/>
 <polygon points="200,305 226,300 216,326 200,330" fill="#8A6514"/>

 <polygon points="248,186 254,195 245,195" fill="#D9622B"/>

 <polygon points="186,286 214,286 200,306" fill="#0B0A08"/>
 <line x1="200" y1="110" x2="200" y2="286" stroke="#0B0A08" stroke-width="2" opacity=".5"/>
 </g>
</symbol>
</defs></svg>

<section class="p grao" id="perfil"><svg><use href="#emb"/></svg></section>

<section class="p grao" id="banner"><div class="linhas"></div>
 <div class="faixa"><svg><use href="#emb"/></svg>
  <div><h1>RAPOSA <i>E</i> LEÃO</h1><p>Astúcia para ver as armadilhas. Força para afastar os lobos.</p><small>MAQUIAVEL · PODER · ESTRATÉGIA</small></div></div>
</section>

<section class="p th grao" id="th1"><div class="brilho"></div><div class="foto"></div>
 <div class="txt"><div class="tag">O PRÍNCIPE · CAP. 17</div><h2>Melhor ser<br><b>temido</b><br>que amado?</h2></div>
 <div class="selo"><svg><use href="#emb"/></svg>RAPOSA E LEÃO</div></section>

<section class="p th b grao" id="th2"><div class="brilho"></div><div class="foto"></div>
 <div class="txt"><div class="tag">LIÇÕES PROIBIDAS</div><h2 style="font-size:112px;line-height:1">O que<br>ninguém te<br><em>conta</em> sobre<br><b>poder</b></h2></div>
 <div class="selo"><svg><use href="#emb"/></svg>RAPOSA E LEÃO</div></section>

<script>
// juba: raios alternados no lado direito
const g=document.getElementById('juba');let pts=[];const cx=200,cy=200;
for(let i=0;i<=14;i++){const a=(-100+i*(200/14))*Math.PI/180;const r=i%2?132:178;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}
const ns='http://www.w3.org/2000/svg';
for(let i=0;i<pts.length-1;i++){const p=document.createElementNS(ns,'polygon');p.setAttribute('points',`${cx},${cy} ${pts[i]} ${pts[i+1]}`);p.setAttribute('fill',i%2?'#6E4A0E':'#8A5A12');g.appendChild(p)}
</script>
</body></html>
