<style>

#t3{position:absolute;left:50%;top:__T3__px;transform:translateX(-50%) rotate(-6deg);border:8px dashed #D7263D;border-radius:22px;padding:28px 44px;color:#F2D58A;background:rgba(10,12,20,.55);font:800 __FT3__px/1.05 Cinzel;text-align:center;opacity:0;max-width:88%}

#cta .pg p{color:#1F2544;text-shadow:none}#cta .pg p b{color:#D7263D}

#cta .ins{display:flex;align-items:center;gap:18px;background:#D7263D;color:#fff;border-radius:99px;padding:22px 46px;font:800 46px Manrope;letter-spacing:.04em;box-shadow:0 14px 40px rgba(0,0,0,.5)}

</style></head><body>
<canvas id="gl" width="__W__" height="__H__"></canvas><div id="sombra"></div><canvas id="px" width="__W__" height="__H__"></canvas>
<div id="marca">__MARCA__</div><div id="tit"></div><div id="ver"></div><div id="cap"></div><div id="cta"></div><div id="t2"></div><div id="t3"></div><div id="int"></div>
<script>
const SP=__SPEC__,$=id=>document.getElementById(id),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>{x=cl(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const W=__W__,H=__H__,gl=$('gl').getContext('webgl',{preserveDrawingBuffer:true});
const VS=`attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;v.y=1.-v.y;gl_Position=vec4(p,0,1);}`;
const FS=`precision highp float;varying vec2 v;uniform sampler2D A,AD,B,BD;uniform vec4 ca,cb;uniform vec2 ia,ib,par_a,par_b;uniform float mixv,t,flick;
vec2 fit(vec2 uv,vec2 ir,vec4 c){float sr=${(W/H).toFixed(4)};vec2 s=ir.x/ir.y>sr?vec2(sr/(ir.x/ir.y),1.):vec2(1.,(ir.x/ir.y)/sr);return (uv-.5)*s/c.z+.5+c.xy;}
vec3 amostra(sampler2D im,sampler2D dp,vec2 ir,vec4 c,vec2 par){vec2 u=fit(v,ir,c);float d=texture2D(dp,u).r;u+= (d-.45)*par;u=clamp(u,.002,.998);return texture2D(im,u).rgb;}
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){vec3 a=amostra(A,AD,ia,ca,par_a),b=amostra(B,BD,ib,cb,par_b);vec3 c=mix(a,b,mixv);
float g=dot(c,vec3(.299,.587,.114));g=pow(smoothstep(.06,.94,g),1.25);
vec3 sombra=vec3(__SOMBRA__),meio=vec3(__MEIO__),luz=vec3(__LUZ__);
vec3 col=g<.5?mix(sombra,meio,g*2.):mix(meio,luz,(g-.5)*2.);
vec2 q=v-.5;float vig=smoothstep(.95,.25,length(q*vec2(${(W/H).toFixed(3)},1.)*1.15));col*=mix(.28,1.,vig);
col+=vec3(1.,.75,.4)*.06*flick*smoothstep(.7,0.,length(q-vec2(.18,-.3)));
col+=(h(v*vec2(${W}.,${H}.)+t)-.5)*__GR__;gl_FragColor=vec4(col,1.);}`;
function sh(tp,src){const s=gl.createShader(tp);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const pl=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
function tex(img){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t}
const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src});
// imagens ficam decodificadas na memória; na GPU só as texturas da cena atual e da próxima (vídeos longos perdiam o WebGL)
let IM=[];const TXC={};
async function prep(){for(const s of SP.cenas){const [a,d]=await Promise.all([load(s.img),load(s.dep)]);IM.push({a,d})}}
function TX_(k){if(!TXC[k]){const m=IM[k];TXC[k]={a:tex(m.a),d:tex(m.d),r:[m.a.width,m.a.height]}}return TXC[k]}
function limpa(i,j){for(const k in TXC)if(+k!==i&&+k!==j){gl.deleteTexture(TXC[k].a);gl.deleteTexture(TXC[k].d);delete TXC[k]}}
// movimento de câmera por cena: zoom lento + pan + parallax
// cortes a cada ~4 s dentro da cena: o 1º plano é o movimento da cena; os seguintes enquadram detalhes da gravura
const hs=(a,b)=>{const r=Math.sin(a*127.1+b*311.7)*43758.5453;return r-Math.floor(r)};
function cam(i,u,tl){const s=SP.cenas[i],m=s.mov||['in','esq','dir','out','cima'][i%5],D=s.fim-s.ini,n=Math.max(1,Math.round(D/4.2)),L=D/n,k0=Math.min(n-1,Math.floor((tl||0)/L)),v=cl(((tl||0)-k0*L)/L);
 if(k0===0||!tl){const uu=n>1?v:u,z0=m==='out'?1.22:1.06,z1=m==='out'?1.06:1.22,px=m==='esq'?.04-.08*uu:m==='dir'?-.04+.08*uu:0,py=m==='cima'?.03-.06*uu:0,k=ease(uu);
  return {c:[px,py,z0+(z1-z0)*k,0],par:[(.5-uu)*.035,(.5-uu)*.012]}}
 const L16=W>H,z=L16?1.12+.22*hs(i,k0):1.35+.4*hs(i,k0),lim=(1-1/z)/2*(L16?.6:.9),fx=(hs(k0,i+7)-.5)*2*lim,fy=(hs(i+3,k0*2)-.5)*2*lim*.8,dz=hs(i*5,k0)<.5?.06:-.06,dx=(hs(k0*3,i)-.5)*.03;
 return {c:[fx+dx*v,fy,z+dz*ease(v),0],par:[(.5-v)*.03,(.5-v)*.01]}}
function bind(slot,unit,t){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(U(slot),unit)}
// partículas de poeira dourada
const px=$('px').getContext('2d'),P=[...Array(70)].map((_,i)=>{const r=Math.sin(i*91.7)*43758.5,f=r-Math.floor(r),r2=Math.sin(i*17.3)*9631.1,g=r2-Math.floor(r2);return{x:f*W,y:g*H,s:1+f*2.6,v:6+g*18,ph:i}});
function poeira(t){px.clearRect(0,0,W,H);for(const p of P){const y=(p.y-t*p.v+H*4)%H,x=p.x+Math.sin(t*.4+p.ph)*18;px.fillStyle=`rgba(242,213,138,${.25+.35*Math.abs(Math.sin(t+p.ph))})`;px.beginPath();px.arc(x,y,p.s,0,7);px.fill()}}
const CH=[];SP.cenas.forEach(s=>{const w=s.words||[];for(let k=0;k<w.length;k+=3){const bl=w.slice(k,k+3);CH.push({a:bl[0][1],z:w[k+3]?w[k+3][1]:bl[bl.length-1][1]+.6,w:bl})}});

// ---- conversa com o ouvinte (cena com "interage") ----
const IC={comenta:'<svg viewBox="0 0 24 24"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 1-2z"/></svg>',
 checkin:'<svg viewBox="0 0 24 24"><path d="M2 10h4v12H2zM8 22h10.5a2 2 0 0 0 2-1.6l1.4-7A2 2 0 0 0 20 11h-6l1-5a2.2 2.2 0 0 0-4-1.4L8 10z"/></svg>',
 segue:'<svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5-6.7V3.5a2 2 0 0 0-4 0v.8A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg>',
 salva:'<svg viewBox="0 0 24 24"><path d="M6 2h12a1 1 0 0 1 1 1v19l-7-4-7 4V3a1 1 0 0 1 1-1z"/></svg>',
 manda:'<svg viewBox="0 0 24 24"><path d="M14 4l8 8-8 8v-5C8 15 4.5 17 2 21c1-6 4-11 12-12z"/></svg>'};
const ROT={comenta:'Comenta aí',checkin:'Tá comigo?',segue:'Segue o canal',salva:'Salva esse',manda:'Manda pra alguém'};
function interacao(s,t){const e=$('int'),it=s.interage;if(!it){e.style.opacity=0;return}
 const a=s.ini+.45,z=s.fim-.25,k=cl((t-a)/.35)*cl((z-t)/.3),pop=1+.08*Math.sin(Math.PI*cl((t-a)/.35));
 e.style.opacity=k;e.style.transform=`translateX(-50%) scale(${(.85+.15*cl((t-a)/.35))*pop})`;
 const n=Math.floor(cl((t-a-.2)/1.4)*it.txt.length),txt=it.tipo==='comenta'?it.txt.slice(0,n)+(n<it.txt.length?'<span style="opacity:.5">|</span>':''):it.txt;
 let bt='';if(it.tipo==='segue'){const ok=t>a+1.6;bt=`<div class="bt ${ok?'g':'r'}">${IC.segue}${ok?'INSCRITO ✓':'INSCREVER-SE'}</div>`}
 else if(it.tipo==='salva'){const ok=t>a+1.6;bt=`<div class="bt ${ok?'g':'r'}">${IC.salva}${ok?'SALVO ✓':'SALVAR'}</div>`}
 else if(it.tipo==='manda')bt=`<div class="bt r">${IC.manda}COMPARTILHAR</div>`;
 e.innerHTML=`<div class="box"><div class="av">${IC[it.tipo]||IC.comenta}</div><div class="tx"><small>${ROT[it.tipo]||'Comenta aí'}</small>${txt}${bt?'<br>'+bt:''}</div></div>`}
window.render=t=>{
 let i=SP.cenas.findIndex(s=>t>=s.ini&&t<s.fim);if(i<0)i=t<SP.cenas[0].ini?0:SP.cenas.length-1;const s=SP.cenas[i];
 const D=s.fim-s.ini,u=cl((t-s.ini)/D),j=Math.min(i+1,SP.cenas.length-1),FADE=.7,mixv=i===j?0:cl((t-(s.fim-FADE))/FADE);
 const a=cam(i,u,t-s.ini),b=cam(j,0,0);
 if(gl.isContextLost())throw new Error('WebGL perdido');limpa(i,j);const TX={[i]:TX_(i),[j]:TX_(j)};
 bind('A',0,TX[i].a);bind('AD',1,TX[i].d);bind('B',2,TX[j].a);bind('BD',3,TX[j].d);
 gl.uniform4fv(U('ca'),a.c);gl.uniform4fv(U('cb'),b.c);gl.uniform2fv(U('ia'),TX[i].r);gl.uniform2fv(U('ib'),TX[j].r);gl.uniform2fv(U('par_a'),a.par);gl.uniform2fv(U('par_b'),b.par);
 gl.uniform1f(U('mixv'),mixv);gl.uniform1f(U('t'),t%7);gl.uniform1f(U('flick'),.6+.4*Math.sin(t*7.3)*Math.sin(t*3.1));
 gl.viewport(0,0,W,H);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);poeira(t);
 // título de abertura
 // título de abertura ou de capítulo (cena com "cap")
 const tt=SP.titulo_tela;let tk=0,th='',tz=1;
 if(t<tt.fim){tk=cl(t/.8)*cl((tt.fim-t)/.6);th=`<small>${tt.sup}</small>${tt.txt}`;tz=1.06-.06*cl(t/tt.fim)}
 else if(s.cap){const f=s.ini+3.4;tk=t<f?cl((t-s.ini)/.7)*cl((f-t)/.6):0;th=`<small>${s.cap.sup}</small>${s.cap.txt}`;tz=1.06-.06*cl((t-s.ini)/3.4)}
 const ab=t<tt.fim?((SP.estilo||{}).abre||0):0;
 for(const [id,on] of [['tit',ab===0],['t2',ab===1],['t3',ab===2]]){const el=$(id);el.style.opacity=on?tk:0;if(on)el.innerHTML=th+(id==='t2'?`<i style="transform:scaleX(${cl(t/1.2)})"></i>`:'')}
 $('tit').style.transform=`scale(${tz})`;$('t3').style.transform=`translateX(-50%) rotate(-6deg) scale(${1.25-.25*cl(t/.35)})`;
 // versículo
 const vv=s.verso?cl((t-s.ini-.4)/.6)*cl((s.fim-t)/.4):0;$('ver').style.opacity=vv;if(s.verso)$('ver').innerHTML=`“${s.verso}”<span>${s.ref}</span>`;
 interacao(s,t);
 // legenda
 const c=CH.find(c=>t>=c.a-.05&&t<c.z);$('cap').innerHTML=c&&!s.cta?c.w.map(([x,ts])=>`<span class="${t>=ts?'on':''}">${x}</span>`).join(' '):'';
 // selo de chamada só durante a cena que tem "cta" (a última fica até o fim)
 if(s.cta){const ult=i===SP.cenas.length-1,k=cl((t-s.ini)/.6)*(ult?1:cl((s.fim-t)/.5));$('cta').style.opacity=k;const fe=(SP.estilo||{}).fecha||0;$('cta').innerHTML=fe===1?`<div class="ins">${IC.segue}INSCREVER-SE</div><p>${s.cta}</p>`:fe===2?`<div class="pg"><div class="mk">${s.selo||'__SELO__'}</div><p>${s.cta}</p></div>`:`<div class="sel">${s.selo||'__SELO__'}</div><p>${s.cta}</p>`}else $('cta').style.opacity=0;
};
prep().then(()=>document.fonts.ready).then(()=>{window.ready=true});
</script></body></html>
