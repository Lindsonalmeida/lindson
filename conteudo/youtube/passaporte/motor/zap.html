<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&family=Special+Elite&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#1F2544;font-family:Nunito,sans-serif;color:#1F2544}
#wall{position:absolute;left:0;right:0;top:250px;bottom:0;background:#EFE4CF}
#wall canvas{position:absolute;inset:0}
#hd{position:absolute;left:0;right:0;top:0;height:250px;background:#1F2544;color:#FFF7E8;display:flex;align-items:center;gap:26px;padding:70px 40px 0}
#hd .vt{font:800 60px 'Baloo 2';opacity:.8}
#hd .gav{width:120px;height:120px;border-radius:50%;background:#FFF7E8;display:grid;place-items:center}#hd .gav img{width:74%}
#hd b{display:block;font:800 52px/1.05 'Baloo 2'}#hd small{display:block;font:700 32px Nunito;color:#C9C3B0;margin-top:4px}
#hd small.dig{color:#9CC152}
#nota{position:absolute;left:40px;right:40px;top:280px;background:#FFE58A;border-radius:22px;padding:26px 32px 28px 110px;font:800 48px/1.22 'Baloo 2';box-shadow:0 14px 30px rgba(0,0,0,.18);transform-origin:50% 0;z-index:5}
#nota:before{content:"🎙️";position:absolute;left:30px;top:24px;font-size:58px}
#nota .on{color:#D7263D}
#chat{position:absolute;left:0;right:0;top:250px;bottom:150px;overflow:hidden}
.b{position:absolute;left:0;right:0;padding:0 40px;display:flex;gap:18px;align-items:flex-end;opacity:0;transform-origin:0 100%}
.av{flex:none;width:100px;height:100px;border-radius:50%;background:#FFF7E8;display:grid;place-items:center;border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.12)}.av img{width:76%}
.bub{position:relative;background:#fff;border-radius:8px 30px 30px 30px;padding:20px 28px 16px;max-width:780px;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.bub .nm{font:800 34px 'Baloo 2';line-height:1}
.bub .tx{font:700 46px/1.25 Nunito;margin-top:6px}
.bub .hr{font:700 26px Nunito;color:#9b9584;text-align:right;margin-top:4px}
.re{position:absolute;right:-18px;bottom:-34px;background:#fff;border-radius:30px;padding:2px 14px;font-size:44px;box-shadow:0 3px 8px rgba(0,0,0,.15);opacity:0}
.aud{display:flex;align-items:center;gap:20px;margin-top:8px}.aud .pl{width:70px;height:70px;border-radius:50%;background:#3F9A55;color:#fff;display:grid;place-items:center;font-size:36px}
.aud .wv{display:flex;gap:6px;align-items:center;height:70px}.aud .wv i{width:9px;border-radius:5px;background:#9b9584}
.aud .tm{font:700 30px Nunito;color:#9b9584}
.stk img{width:300px;height:300px}
.sis{justify-content:center}.sis span{background:#FFF7E8;border-radius:20px;padding:12px 26px;font:800 34px Nunito;color:#6b6655;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.vers{justify-content:center}.vers div{width:940px;background:#1F2544;color:#FFF7E8;border-radius:28px;padding:30px 36px;border:5px solid #C9A227}
.vers small{display:block;font:400 30px 'Special Elite';color:#C9A227;letter-spacing:.08em}.vers p{font:800 50px/1.2 'Baloo 2';margin-top:8px}
.dig .bub{padding:26px 34px}.dig .bub span{display:inline-block;width:20px;height:20px;border-radius:50%;background:#9b9584;margin:0 5px}
#bar{position:absolute;left:0;right:0;bottom:0;height:150px;background:#F6EEDD;display:flex;align-items:center;gap:20px;padding:0 30px}
#bar div{flex:1;height:96px;border-radius:48px;background:#fff;font:700 36px Nunito;color:#a59f8c;display:flex;align-items:center;padding:0 36px}
#bar i{width:96px;height:96px;border-radius:50%;background:#3F9A55;display:grid;place-items:center;font-size:44px;font-style:normal}
#fim{position:absolute;inset:0;background:rgba(31,37,68,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;opacity:0;text-align:center;color:#FFF7E8;padding:0 80px;z-index:9}
#fim .sel{width:420px;height:420px;border-radius:50%;border:12px dashed #D7263D;color:#D7263D;background:#FFF7E8;display:grid;place-items:center;font:800 70px/1 'Baloo 2';transform:rotate(-10deg)}
#fim p{font:800 70px/1.1 'Baloo 2'}#fim small{font:400 38px 'Special Elite';color:#C9A227;letter-spacing:.1em}
#marca{position:absolute;right:40px;top:80px;font:400 24px 'Special Elite';color:#C9C3B0;letter-spacing:.1em}
</style></head><body>
<div id="wall"><canvas id="cv" width="1080" height="1670"></canvas></div>
<div id="hd"><span class="vt">‹</span><div class="gav"><img id="gimg"></div><div><b id="gnome"></b><small id="gsub"></small></div></div>
<div id="marca">PASSAPORTE DA BÍBLIA</div>
<div id="chat"></div><div id="nota"></div>
<div id="bar"><div>Mensagem</div><i>🎤</i></div>
<div id="fim"><div class="sel">FOFOCA<br>BÍBLICA</div><p id="fimtx"></p><small id="fimref"></small></div>
<script>
const SP=__SPEC__,$=id=>document.getElementById(id),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
$('gimg').src=SP.chat.icone;$('gnome').textContent=SP.chat.nome;
const membros=Object.keys(SP.pessoas).join(', ');
const CORES=['#D9573B','#3B8EDB','#8466C4','#3F9A55','#E2668E','#B5651D','#8E2C48'];const corDe={};Object.keys(SP.pessoas).forEach((p,i)=>corDe[p]=CORES[i%CORES.length]);
const SFX=[];const chat=$('chat');const B=[];
function hora(i){return '9:'+String(10+i).padStart(2,'0')}
SP.cenas.forEach((c,i)=>{
 let h='',cls='b';
 if(c.tipo==='msg'||c.tipo==='audio'||c.tipo==='figurinha'){const P=SP.pessoas[c.de]||{};
  const corpo=c.tipo==='msg'?`<div class="tx">${c.txt}</div>`:c.tipo==='audio'?`<div class="aud"><span class="pl">▶</span><span class="wv">${Array.from({length:22},(_,k)=>`<i style="height:${18+((k*37)%46)}px"></i>`).join('')}</span><span class="tm">0:${String(Math.max(3,Math.round(c.dur||5))).padStart(2,'0')}</span></div>`:'';
  if(c.tipo==='figurinha'){cls+=' stk';h=`<div class="av"><img src="${P.icone}"></div><div><img src="${c.icone}"></div>`}
  else h=`<div class="av"><img src="${P.icone}"></div><div class="bub"><div class="nm" style="color:${corDe[c.de]}">${c.de}</div>${corpo}<div class="hr">${hora(i)}</div><span class="re" id="re${i}"></span></div>`}
 if(c.tipo==='sistema'){cls+=' sis';h=`<span>${c.txt}</span>`}
 if(c.tipo==='versiculo'){cls+=' vers';h=`<div><small>📌 MENSAGEM FIXADA · ${c.ref}</small><p>“${c.txt}”</p></div>`}
 if(!h)return;
 const el=document.createElement('div');el.className=cls;el.innerHTML=h;chat.appendChild(el);B.push({el,i,ini:c.ini,c});
});
// indicador "digitando"
const dg=document.createElement('div');dg.className='b dig';dg.innerHTML=`<div class="av"><img id="dgi"></div><div class="bub"><span></span><span></span><span></span></div>`;chat.appendChild(dg);
let alturas;function medir(){alturas=B.map(b=>b.el.getBoundingClientRect().height)}
const reac={};SP.cenas.forEach((c,i)=>{if(c.tipo==='reacao'){for(let j=i-1;j>=0;j--){if(['msg','audio'].includes(SP.cenas[j].tipo)){reac[j]={e:c.emoji,t:c.ini};break}}}});
const narras=SP.cenas.filter(c=>['narra','sistema','versiculo','fim'].includes(c.tipo)||false);
SP.cenas.forEach(c=>{if(['msg','audio'].includes(c.tipo))SFX.push([c.ini,'pop']);if(c.tipo==='figurinha')SFX.push([c.ini,'pop']);if(c.tipo==='reacao')SFX.push([c.ini,'tic']);if(c.tipo==='sistema')SFX.push([c.ini,'whoosh']);if(c.tipo==='versiculo')SFX.push([c.ini,'carimbo']);if(c.tipo==='fim')SFX.push([c.ini+.3,'carimbo'])});
window.SFX=SFX;
// papel de parede com ícones de viagem
const cx=$('cv').getContext('2d');function parede(t){cx.fillStyle='#EFE4CF';cx.fillRect(0,0,1080,1670);cx.globalAlpha=.10;cx.font='64px serif';const S=['✈️','📖','🧭','⭐','🗺️','🕊️'];
 for(let y=0;y<1800;y+=170)for(let x=0;x<1200;x+=190){cx.fillText(S[(x/190+y/170)%S.length|0],x+((y/170)%2)*90,(y+t*12)%1840-80)}cx.globalAlpha=1}
window.render=t=>{
 if(!alturas)medir();parede(t);
 const vis=B.filter(b=>t>=b.ini);const H=chat.clientHeight-30;let y=H;
 for(let k=vis.length-1;k>=0;k--){const b=vis[k],hh=alturas[B.indexOf(b)];y-=hh+26;const a=ease((t-b.ini)/.35);b.el.style.top=y+'px';b.el.style.opacity=a;b.el.style.transform=`scale(${.85+.15*back((t-b.ini)/.35)})`}
 B.filter(b=>t<b.ini).forEach(b=>b.el.style.opacity=0);
 // digitando: até 0,9 s antes de cada msg/áudio
 const prox=B.find(b=>t<b.ini&&['msg','audio'].includes(b.c.tipo)&&b.ini-t<.9);
 if(prox){const P=SP.pessoas[prox.c.de];$('dgi').src=P.icone;dg.style.opacity=1;dg.style.top=(y-130)+'px';$('gsub').textContent=prox.c.de+(prox.c.tipo==='audio'?' está gravando áudio…':' está digitando…');$('gsub').className='dig'}
 else{dg.style.opacity=0;$('gsub').textContent=membros;$('gsub').className=''}
 Object.entries(reac).forEach(([j,r])=>{const e=$('re'+j);if(e){e.textContent=r.e;e.style.opacity=t>=r.t?1:0;e.style.transform=`scale(${t>=r.t?back((t-r.t)/.3):0})`}});
 // bilhete da narradora com destaque palavra a palavra
 const n=SP.cenas.filter(c=>c.tipo==='narra'&&t>=c.ini-.1&&t<c.fim).pop();const nota=$('nota');
 if(n){nota.style.opacity=1;nota.style.transform=`scale(${.9+.1*back((t-n.ini)/.3)})`;nota.innerHTML=(n.words||[]).map(([w,ts])=>`<span class="${t>=ts?'on':''}">${w}</span>`).join(' ')||n.txt}else{nota.style.opacity=0}
 const f=SP.cenas.find(c=>c.tipo==='fim');if(f){const k=ease((t-f.ini)/.5);$('fim').style.opacity=k;$('fimtx').textContent=f.txt;$('fimref').textContent='LEIA: '+SP.ref}
};
document.fonts.ready.then(()=>{window.ready=true});
</script></body></html>
