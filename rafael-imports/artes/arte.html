<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Arte · Rafael Imports</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@500;700&display=swap">
<style>
  /* Arte 1080×1350 (feed 4:5) de um aparelho: ?m=<id>. Animada para virar vídeo. */
  :root { --gold: #F5C518; --gold-hi: #FFE27A; --ink: #08080A; --metal: linear-gradient(135deg, #FFE9A0 0%, #E2B33C 28%, #9C7414 52%, #F2CB5B 74%, #B8891A 100%); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); }
  .art {
    position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #F6F3EA;
    font-family: Manrope, sans-serif;
    background:
      radial-gradient(circle at 50% 40%, rgba(245,197,24,.28), transparent 50%),
      radial-gradient(circle at 85% 8%, rgba(245,197,24,.12), transparent 35%),
      #08080A;
  }
  .grid {
    position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(245,197,24,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(245,197,24,.07) 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: radial-gradient(circle at 50% 42%, #000 20%, transparent 70%);
  }
  .ring { position: absolute; left: 50%; top: 520px; width: 760px; height: 760px; margin: -380px 0 0 -380px; border-radius: 50%; border: 2px solid rgba(245,197,24,.25); animation: pulse 3s ease-out infinite; }
  .ring.r2 { animation-delay: 1.5s; }
  @keyframes pulse { 0% { transform: scale(.55); opacity: .9; } 100% { transform: scale(1.15); opacity: 0; } }

  .top { position: absolute; top: 56px; left: 64px; right: 64px; display: flex; align-items: center; justify-content: space-between; animation: down .8s cubic-bezier(.2,.8,.2,1) both; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px var(--gold), 0 0 30px rgba(245,197,24,.4); }
  .brand b { display: block; font: 800 30px/1 Sora, sans-serif; letter-spacing: .02em; }
  .brand span { font: 500 15px/1.4 'JetBrains Mono', monospace; letter-spacing: .14em; color: var(--gold); text-transform: uppercase; }
  .tag { padding: 12px 20px; border-radius: 10px; background: var(--gold); color: #1A1402; font: 700 18px/1 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }

  .stage { position: absolute; left: 0; right: 0; top: 175px; height: 680px; perspective: 1400px; }
  .ph { position: absolute; top: 10px; height: 640px; filter: drop-shadow(0 40px 50px rgba(0,0,0,.65)); }
  .ph svg { height: 100%; width: auto; display: block; }
  .ph.a { left: 50%; margin-left: -60px; animation: inA 1.1s cubic-bezier(.2,.8,.2,1) .2s both, floatA 5s ease-in-out 1.3s infinite; z-index: 2; }
  .ph.b { left: 50%; margin-left: -265px; top: 55px; height: 575px; opacity: .95; animation: inB 1.1s cubic-bezier(.2,.8,.2,1) .45s both, floatB 5s ease-in-out 1.55s infinite; }
  @keyframes inA { from { transform: translateY(260px) rotate(8deg); opacity: 0; } to { transform: rotate(6deg); opacity: 1; } }
  @keyframes inB { from { transform: translateY(300px) rotate(-14deg); opacity: 0; } to { transform: rotate(-10deg); opacity: 1; } }
  @keyframes floatA { 0%, 100% { transform: rotate(6deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-16px); } }
  @keyframes floatB { 0%, 100% { transform: rotate(-10deg) translateY(0); } 50% { transform: rotate(-12deg) translateY(-10px); } }
  .ph .sheen { animation: sheen 3.2s ease-in-out 1s infinite; }
  @keyframes sheen { 0% { transform: rotate(14deg) translateX(0); } 60%, 100% { transform: rotate(14deg) translateX(560px); } }
  .glow { position: absolute; left: 50%; bottom: 0; width: 520px; height: 50px; margin-left: -260px; background: radial-gradient(closest-side, rgba(245,197,24,.55), transparent); filter: blur(8px); }

  .info { position: absolute; left: 64px; right: 64px; top: 880px; text-align: center; }
  h1 { margin: 0; font: 800 82px/1 Sora, sans-serif; letter-spacing: -.02em; background: var(--metal); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: up .8s cubic-bezier(.2,.8,.2,1) .7s both, shine 4s ease-in-out 1.5s infinite; }
  @keyframes shine { 50% { background-position: 100% 0; } }
  .fr { margin: 14px 0 0; font: 500 27px/1.35 Manrope, sans-serif; color: #CFC9BC; animation: up .8s cubic-bezier(.2,.8,.2,1) .85s both; }
  .dest { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 34px; }
  .dest div { padding: 18px 10px; border-radius: 18px; background: rgba(255,255,255,.05); border: 1.5px solid rgba(245,197,24,.3); animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
  .dest b { display: block; font: 800 29px/1.1 Sora, sans-serif; color: var(--gold); }
  .dest span { display: block; margin-top: 6px; font: 500 14px/1.25 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; color: #A9A49A; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes down { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }

  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 132px; background: #0d0d10; border-top: 2px solid var(--gold); display: flex; align-items: center; justify-content: space-between; padding: 0 64px; animation: up .8s cubic-bezier(.2,.8,.2,1) 1.4s both; }
  .stripes { position: absolute; left: 0; right: 0; bottom: 132px; height: 14px; background: repeating-linear-gradient(-45deg, var(--gold) 0 18px, #000 18px 36px); background-size: 51px 100%; animation: slide 1.2s linear infinite; }
  @keyframes slide { to { background-position: 51px 0; } }
  .perks { display: flex; flex-direction: column; gap: 6px; font: 700 22px/1.2 Manrope, sans-serif; }
  .perks span::before { content: "◆ "; color: var(--gold); font-size: 15px; vertical-align: 3px; }
  .wa { display: flex; align-items: center; gap: 14px; padding: 18px 26px; border-radius: 18px; background: #25D366; color: #04210F; font: 800 25px/1.1 Sora, sans-serif; }
  .wa small { display: block; font: 700 14px/1 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; opacity: .8; margin-bottom: 4px; }
  .wa svg { width: 40px; height: 40px; }
  .ilu { position: absolute; right: 64px; bottom: 150px; font: 500 13px/1 'JetBrains Mono', monospace; color: #6f6b62; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="art" id="art">
  <div class="grid"></div>
  <div class="ring"></div><div class="ring r2"></div>
  <div class="top">
    <div class="brand"><img src="../img/logo.jpg" alt=""><div><b>RAFAEL IMPORTS</b><span>São Luís · MA</span></div></div>
    <div class="tag" id="tag"></div>
  </div>
  <div class="stage"><div class="ph b" id="pb"></div><div class="ph a" id="pa"></div><div class="glow"></div></div>
  <div class="info">
    <h1 id="nome"></h1>
    <p class="fr" id="fr"></p>
    <div class="dest" id="dest"></div>
  </div>
  <span class="ilu">imagem ilustrativa</span>
  <div class="stripes"></div>
  <div class="foot">
    <div class="perks"><span>6 meses de garantia + brindes</span><span>Entrega grátis em São Luís</span></div>
    <div class="wa"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg><div><small>Vendas</small>(98) 8700-7737</div></div>
  </div>
</div>
<script src="../produtos.js"></script>
<script>
  var id = (/[?&]m=(\w+)/.exec(location.search) || [])[1] || "x8pro";
  var p = RI_PRODUTOS.filter(function (x) { return x.id === id; })[0] || RI_PRODUTOS[0];
  document.getElementById("tag").textContent = "Lançamento · " + p.tag;
  document.getElementById("nome").textContent = p.nome;
  document.getElementById("fr").textContent = p.frase;
  document.getElementById("pa").innerHTML = RI_SVG(p, 0);
  document.getElementById("pb").innerHTML = RI_SVG(p, 1);
  document.getElementById("dest").innerHTML = p.dest.map(function (d, i) {
    return '<div style="animation-delay:' + (1 + i * .12) + 's"><b>' + d[0] + '</b><span>' + d[1] + '</span></div>';
  }).join("");
  if (p.nome.length > 16) document.getElementById("nome").style.fontSize = "68px";
</script>
</body>
</html>
