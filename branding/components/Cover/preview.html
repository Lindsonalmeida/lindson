<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lindson Almeida</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ink); color: var(--fg); font-family: var(--font-body); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .signal { fill: var(--signal); }
  .sun { fill: var(--sun); }
  .tint { fill: var(--signal-soft); }
  .violet { fill: var(--violet); }
  .blk { rx: var(--radius-card); }
  .pill { rx: 8px; }
  .core { fill: var(--ink); }
  .ring { fill: none; stroke: var(--ink); stroke-width: 3; }
  .ring.out { stroke: var(--signal); stroke-width: 2; }
  .words { position: absolute; left: 32px; bottom: 32px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 100px; line-height: .95; font-weight: 800; letter-spacing: -.035em; color: var(--fg); }
  .tag { margin: 12px 0 0 4px; font-size: 14px; line-height: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      signal 160×240 bled off the top (a assinatura, maior) · sun 128×152 (a ação, uma só) · signal-soft 160×216 sangrando à direita (o alívio) · violet pílula 56×16 (aparece pouco, como na marca) — cerca de 40% de 960×288
  arrangement uma placa alta com satélites, bases alinhadas a 24px da borda, intervalos de space-gutter (16px)
  pattern     ondas de sinal: núcleo e três anéis recortados em ink dentro da placa signal, um anel signal escapando para o fundo — a foto que irradia ("sinal que se espalha")
  scales      lados em múltiplos de space-gutter (16px); cantos radius-card (16px); pílula rx 8 (metade de 16); anéis com passo de 16px
-->
<rect class="signal blk" x="32" y="-16" width="160" height="280" rx="16"/>
<rect class="violet pill" x="208" y="64" width="56" height="16" rx="8"/>
<rect class="sun blk" x="208" y="96" width="128" height="168" rx="16"/>
<rect class="tint blk" x="352" y="48" width="160" height="216" rx="16"/>
<circle class="core" cx="112" cy="128" r="28"/>
<circle class="ring" cx="112" cy="128" r="44"/>
<circle class="ring" cx="112" cy="128" r="60"/>
<circle class="ring" cx="112" cy="128" r="76"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Lindson<br>Almeida</h1>
  <p class="tag">Comunicação que mobiliza e engaja.</p>
</div>
</div>
</body>
</html>
