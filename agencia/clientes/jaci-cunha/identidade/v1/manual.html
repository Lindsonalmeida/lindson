</style><body><script>
const T=19;
const top_=(sec,n,c=C.p)=>`<div class="top" style="color:${c}"><span class="k">${sec}</span><span class="k">${String(n).padStart(2,'0')} / ${T}</span></div>`;

const P=[];
const sw=(hex,n,rgb,cmyk,t='#fff',b='')=>`<div style="background:${hex};color:${t};border-radius:24px;padding:26px;display:flex;flex-direction:column;justify-content:flex-end;${b}"><div class="f" style="font-size:34px;font-weight:560">${n}</div><div style="font-size:15px;line-height:1.7;margin-top:8px;opacity:.9">${hex}<br>RGB ${rgb}<br>CMYK ${cmyk}</div></div>`;

// 01 CAPA
P.push(`<div class="p" style="background:radial-gradient(80% 60% at 30% 30%,#14605D 0%,#0F4C4A 55%,#0A3634 100%);color:#fff">
<svg style="position:absolute;inset:0" viewBox="0 0 1080 1350"><defs>${patD.def}</defs><rect width="1080" height="1350" fill="url(#ls2)"/></svg>
<div style="position:absolute;right:-180px;top:180px;opacity:.95">${mono({s:900,cc:'#ffffff',jc:C.v,dc:C.o,sw:7})}</div>
<div style="position:absolute;left:72px;top:64px">${lockup({fs:40,cc:'#fff',jc:C.v,dc:C.o,t1:'#fff',t2:'#ffffffcc'})}</div>
<div style="position:absolute;left:72px;right:72px;bottom:80px">
<div class="k" style="color:${C.v}">Manual de identidade visual · v1</div>
<h1 class="h" style="font-size:132px;margin-top:22px">Cuidado<br><em>especializado,</em><br>perto de você.</h1>
<div class="k" style="margin-top:40px;opacity:.75;line-height:2">Odontologia especializada · Zé Doca, Maranhão</div></div></div>`);

// 02 SUMÁRIO
const SUM=[['Essência','03'],['O símbolo','04'],['Assinatura principal','05'],['Versões','06'],['Proteção e usos incorretos','07'],['Paleta','08'],['Combinações e contraste','09'],['Tipografia','10'],['Linha do sorriso','11'],['Ícones','12'],['Estilo de foto','13'],['Instagram: feed','14'],['Stories, destaques e avatar','15'],['Papelaria','16'],['Clínica e equipe','17'],['Tom de voz e regras do CFO','18']];
P.push(`<div class="p">${top_('Sumário',2)}<div style="position:absolute;left:72px;top:150px"><h2 class="h">O que<br><em>tem aqui</em></h2></div>
<div style="position:absolute;left:72px;right:72px;top:400px">${SUM.map(([t,n])=>`<div style="display:flex;align-items:baseline;justify-content:space-between;padding:10px 0;border-top:1.5px solid #0F4C4A22"><span class="f" style="font-size:27px;font-weight:500;color:${C.p}">${t}</span><span class="k" style="color:${C.c}">${n}</span></div>`).join('')}</div>${bot_()}</div>`);

// 03 ESSÊNCIA
P.push(`<div class="p" style="background:${C.p};color:#fff">${top_('01 · Essência',3,'#fff')}
<svg style="position:absolute;inset:0" viewBox="0 0 1080 1350"><defs>${patD.def}</defs><rect width="1080" height="1350" fill="url(#ls2)"/></svg>
<div style="position:absolute;left:72px;right:72px;top:150px"><div class="k" style="color:${C.v}">A grande ideia</div>
<h2 class="h" style="font-size:110px;margin-top:22px">Especialista<br>sem precisar<br><em>viajar.</em></h2>
<p class="lead" style="margin-top:36px;color:#ffffffdd">Quem mora em Zé Doca e região não precisa ir a São Luís ou Imperatriz para tratar com especialista. A Dra. Jaci Cunha traz a odontologia especializada para perto de casa, com o acolhimento de quem conhece cada paciente pelo nome.</p></div>
<div style="position:absolute;left:72px;right:72px;bottom:110px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px">
${[['Propósito','Fazer o paciente de Zé Doca e região sorrir sem medo e sem viajar.'],['Personalidade','Acolhedora, segura, moderna e próxima. Especialista sem ser fria.'],['Tom de voz','Simples e calmo, como a dentista que explica tudo com paciência na cadeira.']].map(([t,x])=>`<div style="background:#ffffff12;border:1px solid #ffffff22;border-radius:22px;padding:26px"><div class="k" style="color:${C.v};font-size:12px">${t}</div><p class="x" style="margin-top:12px;color:#fff">${x}</p></div>`).join('')}</div>${bot_('#fff')}</div>`);

// 04 SÍMBOLO
P.push(`<div class="p">${top_('02 · O símbolo',4)}
<div style="position:absolute;left:72px;top:140px"><h2 class="h">Um sorriso,<br><em>três gestos</em></h2></div>
<div style="position:absolute;left:240px;top:420px;width:600px;height:600px">
<svg viewBox="0 0 100 100" width="600" height="600" style="position:absolute;inset:0"><g stroke="${C.p}" stroke-width=".15" fill="none" opacity=".35">${[...Array(11)].map((_,i)=>`<path d="M${i*10} 0V100M0 ${i*10}H100"/>`).join('')}<circle cx="50" cy="50" r="40"/><circle cx="46" cy="54.5" r="14"/></g></svg>

<div style="position:absolute;left:72px;right:72px;bottom:100px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px">
${[[C.p,'O C aberto','O cuidado que acolhe e envolve o paciente, sem fechar a porta.'],[C.c,'A curva do J','O sorriso. É a inicial da Dra. Jaci e o resultado do tratamento.'],[C.o,'O ponto','O brilho do sorriso e o olhar atento da especialista.']].map(([c,t,x])=>`<div><div style="height:6px;width:64px;border-radius:9px;background:${c}"></div><div class="f" style="font-size:32px;font-weight:560;margin-top:18px;color:${C.p}">${t}</div><p class="x">${x}</p></div>`).join('')}</div>${bot_()}</div>`);

P.push(`<div class="p">${top_('03 · Assinatura',5)}<div style="position:absolute;left:72px;top:140px"><h2 class="h">Assinatura<br><em>principal</em></h2></div>

<div class="card" style="height:250px;background:${C.v};display:flex;align-items:center;justify-content:center">${lockup({fs:40,cc:C.p,jc:C.p,dc:C.c,t1:C.p,t2:C.p})}</div></div>

// 06 VERSÕES
P.push(`<div class="p">${top_('04 · Versões',6)}<div style="position:absolute;left:72px;top:140px"><h2 class="h">Uma marca,<br><em>vários formatos</em></h2></div>
<div style="position:absolute;left:72px;right:72px;top:420px;display:grid;grid-template-columns:1fr 1fr;gap:20px">
<div class="card" style="height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center">${lockup({fs:30,dir:'v',city:'Zé Doca · MA'})}<div class="lb">Vertical</div></div>
<div class="card" style="height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center">${mono({s:170})}<div class="lb">Símbolo (avatar, ícone, bordado)</div></div>
<div class="card" style="height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center">${lockup({fs:34,cc:C.g,jc:C.g,dc:C.g,t1:C.g,t2:C.g})}<div class="lb">Monocromática</div></div>
<div class="card" style="height:330px;background:${C.g};display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff">${lockup({fs:34,cc:'#fff',jc:'#fff',dc:'#fff',t1:'#fff',t2:'#fff'})}<div class="lb" style="color:#fff">Negativa (1 cor)</div></div></div>
<p class="x" style="position:absolute;left:72px;right:72px;bottom:100px">Monocromática e negativa servem para carimbo, receituário em 1 cor, bordado, gravação a laser e fundos fotográficos.</p>${bot_()}</div>`);

// 07 PROTEÇÃO E USOS INCORRETOS
const wrong=(st,t)=>`<div><div class="card" style="height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative"><div style="${st}">${lockup({fs:22})}</div><svg style="position:absolute;inset:0" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M8 92L92 8" stroke="${C.c}" stroke-width="1.2"/></svg></div><div class="lb">${t}</div></div>`;
P.push(`<div class="p">${top_('05 · Proteção',7)}<div style="position:absolute;left:72px;top:140px"><h2 class="h">Espaço para<br><em>respirar</em></h2></div>
<div class="card" style="position:absolute;left:72px;width:560px;top:420px;height:330px;display:flex;align-items:center;justify-content:center"><div style="outline:2px dashed ${C.c};outline-offset:44px">${lockup({fs:30})}</div></div>
<div style="position:absolute;left:670px;right:72px;top:430px"><div class="f" style="font-size:30px;font-weight:560;color:${C.p}">Área de proteção</div><p class="x">Em volta da marca, deixe livre a altura do símbolo dividida por 2. Nenhum texto ou imagem entra nesse espaço.</p>
<div class="f" style="font-size:30px;font-weight:560;color:${C.p};margin-top:26px">Tamanho mínimo</div><p class="x">Assinatura: 35 mm ou 180 px de largura.<br>Símbolo: 8 mm ou 24 px.</p></div>
<div class="k" style="position:absolute;left:72px;top:800px;color:${C.c}">Nunca faça</div>
<div style="position:absolute;left:72px;right:72px;top:840px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px">
${wrong('transform:scaleX(1.5)','Esticar ou achatar')+wrong('filter:hue-rotate(160deg)','Trocar as cores')+wrong('transform:rotate(-14deg)','Girar')+wrong('filter:drop-shadow(6px 6px 2px #000a)','Sombra e efeitos')+wrong('opacity:.25','Baixo contraste')+wrong('font-style:italic;filter:blur(1px)','Distorcer ou desfocar')}</div>${bot_()}</div>`);

// 08 PALETA
P.push(`<div class="p">${top_('06 · Paleta',8)}<div style="position:absolute;left:72px;top:140px"><h2 class="h">Cores que<br><em>acalmam</em></h2></div>
<div style="position:absolute;left:72px;right:72px;top:420px;display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:300px 200px 200px;gap:18px">
${sw(C.p,'Petróleo Cuidado','15 76 74','85 35 55 40','#fff','grid-row:span 2')}
${sw(C.v,'Verde-água Sorriso','143 211 199','40 0 25 0',C.p)}
${sw(C.c,'Coral Acolhida','240 127 103','0 60 55 0',C.g)}
${sw(C.o,'Champanhe','200 164 107','20 35 65 5',C.g)}
${sw(C.g,'Grafite','31 43 44','75 55 55 65','#fff')}</div>
<div style="position:absolute;left:72px;right:72px;bottom:96px;display:flex;gap:18px;align-items:center"><div style="width:120px;height:60px;border-radius:14px;background:${C.a};border:1px solid #0F4C4A30"></div><p class="x" style="margin:0"><b>Areia</b> · #F6F0E8 · RGB 246 240 232 · CMYK 2 4 8 0. Fundo principal: quente, limpo e longe do branco hospitalar.</p></div>${bot_()}</div>`);

// 09 COMBINAÇÕES E CONTRASTE
const cb=(bg,fg,t,ok)=>`<div style="background:${bg};color:${fg};border-radius:20px;padding:22px;height:150px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #0F4C4A18"><span class="f" style="font-size:34px;font-weight:560">Aa Sorriso</span><span style="font-size:13px;font-weight:700;letter-spacing:.1em">${t} · ${ok}</span></div>`;
P.push(`<div class="p">${top_('07 · Combinações',9)}<div style="position:absolute;left:72px;top:140px"><h2 class="h">Proporção<br><em>e contraste</em></h2></div>
<div style="position:absolute;left:72px;right:72px;top:410px;height:90px;border-radius:18px;overflow:hidden;display:flex">
<div style="flex:60;background:${C.a};display:flex;align-items:center;padding-left:22px;font-weight:700;color:${C.p}">60% Areia</div><div style="flex:30;background:${C.p};display:flex;align-items:center;padding-left:22px;font-weight:700;color:#fff">30% Petróleo</div><div style="flex:10;background:${C.c};display:flex;align-items:center;justify-content:center;font-weight:700;color:${C.g}">10%</div></div>

<div style="position:absolute;left:72px;right:72px;top:620px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
${cb(C.a,C.p,'Petróleo sobre Areia','AAA')+cb(C.p,'#fff','Branco sobre Petróleo','AAA')+cb(C.v,C.p,'Petróleo sobre Verde-água','AA')+cb('#fff',C.g,'Grafite sobre Branco','AAA')+cb(C.p,C.v,'Verde-água sobre Petróleo','AA')+cb(C.c,C.g,'Grafite sobre Coral','AA')}</div>
<div class="card" style="position:absolute;left:72px;right:72px;bottom:96px;padding:22px 26px;font-size:16px;line-height:1.5"><b style="color:${C.c}">Atenção:</b> Coral e Champanhe sobre fundo claro não passam no contraste para texto pequeno. Use só em títulos grandes, ícones e detalhes.</div>${bot_()}</div>`);

// 10 TIPOGRAFIA
P.push(`<div class="p">${top_('08 · Tipografia',10)}<div style="position:absolute;left:72px;top:140px"><h2 class="h">Duas vozes,<br><em>uma conversa</em></h2></div>
<div style="position:absolute;left:72px;right:72px;top:420px;display:grid;grid-template-columns:1fr 1fr;gap:20px">
<div class="card" style="padding:34px;height:330px"><div class="f" style="font-size:150px;font-weight:560;line-height:1;color:${C.p}">Aa</div><div class="f" style="font-size:34px;font-weight:560;margin-top:14px">Fraunces</div><p class="x">Títulos e frases de impacto. A serifa suave acolhe e dá cara de assinatura.</p></div>
<div class="card" style="padding:34px;height:330px"><div style="font-size:150px;font-weight:700;line-height:1;color:${C.p}">Aa</div><div style="font-size:30px;font-weight:700;margin-top:14px">Manrope</div><p class="x">Textos, legendas e informações. Clara, moderna e fácil de ler no celular.</p></div></div>
<div style="position:absolute;left:72px;right:72px;top:790px">
${[['H1 · Fraunces 560 · 72/76','Sorrir sem medo',72,'f'],['H2 · Fraunces 500 itálico · 44/50','<em>cuidado de especialista</em>',44,'f'],['H3 · Manrope 700 · 24/32','Como funciona a primeira consulta',24,''],['Corpo · Manrope 500 · 18/28','Explique um passo de cada vez, com palavras do dia a dia.',18,''],['Destaque · Manrope 700 · 13 · caixa alta, +30%','AGENDE PELO WHATSAPP',13,'k']].map(([l,t,s,c])=>`<div style="display:grid;grid-template-columns:280px 1fr;align-items:baseline;padding:13px 0;border-top:1.5px solid #0F4C4A1c"><span style="font-size:13px;font-weight:700;opacity:.55">${l}</span><span class="${c}" style="font-size:${s}px;${c==='f'?'font-weight:560;':'font-weight:700;'}color:${C.p};line-height:1.1">${t}</span></div>`).join('')}</div>${bot_()}</div>`);

// 11 LINHA DO SORRISO
P.push(`<div class="p" style="background:${C.p};color:#fff">${top_('09 · Grafismo',11,'#fff')}
<div style="position:absolute;left:72px;top:140px"><h2 class="h">Linha do<br><em>sorriso</em></h2></div>
<div style="position:absolute;left:72px;right:72px;top:420px;display:grid;grid-template-columns:1fr 1fr;gap:20px">
<div style="height:420px;border-radius:26px;overflow:hidden;background:${C.a}"><svg width="100%" height="100%"><defs>${sorriso({id:'g1',fg:C.v,dot:C.c,sc:1.1}).def}</defs><rect width="100%" height="100%" fill="url(#g1)"/></svg></div>
<div style="height:420px;border-radius:26px;overflow:hidden;background:#0A3634"><svg width="100%" height="100%"><defs>${sorriso({id:'g2',fg:'#8FD3C755',dot:C.o,sc:1.1}).def}</defs><rect width="100%" height="100%" fill="url(#g2)"/></svg></div></div>
<div style="position:absolute;left:72px;right:72px;top:880px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px">
${[['O que é','Arcos suaves (a curva do sorriso) e pontos de brilho, tirados do próprio símbolo.'],['Onde usar','Fundos de post, capas de destaque, papelaria, adesivo de vidro e jaleco.'],['Regra','Sempre em segundo plano e em baixo contraste. Nunca atrás de texto pequeno.']].map(([t,x])=>`<div><div class="k" style="color:${C.v};font-size:12px">${t}</div><p class="x" style="margin-top:10px;color:#ffffffdd">${x}</p></div>`).join('')}</div>${bot_('#fff')}</div>`);

// 12 ÍCONES
const IN=Object.keys(ICON);
P.push(`<div class="p">${top_('10 · Ícones',12)}<div style="position:absolute;left:72px;top:140px"><h2 class="h">Os tratamentos<br><em>em ícones</em></h2></div>
<div style="position:absolute;left:72px;right:72px;top:420px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px">
${IN.map((n,i)=>`<div class="card" style="height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">${icone(n,{s:96,bg:[C.v,C.a,'#F9D9D0'][i%3]})}<div style="font-weight:700;font-size:15px;color:${C.p}">${n}</div></div>`).join('')}</div>
<p class="x" style="position:absolute;left:72px;right:72px;bottom:96px">Traço de 5 px, cantos redondos e um ponto de brilho em Coral. Versão redonda para destaques e versão em linha para textos. <b>Ajuste a lista às especialidades que a clínica oferece.</b></p>${bot_()}</div>`);

// 13 ESTILO DE FOTO
P.push(`<div class="p">${top_('11 · Fotos',13)}<div style="position:absolute;left:72px;top:140px"><h2 class="h">Fotos reais,<br><em>luz de janela</em></h2></div>
<div style="position:absolute;left:72px;right:72px;top:420px;display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:300px 300px;gap:18px">
<div class="ph" style="grid-row:span 2;background:linear-gradient(160deg,#E9D8C4,#C9A88A 60%,#8C6E58)"><span>Retrato da Dra. Jaci · jaleco, luz natural lateral</span></div>
<div class="ph" style="background:linear-gradient(160deg,#CFE9E3,#8FD3C7 60%,#4E8F86)"><span>Consultório real, organizado</span></div>
<div class="ph" style="background:linear-gradient(160deg,#F6D8CF,#F07F67 70%,#B85A47)"><span>Atendimento com o paciente</span></div></div>
