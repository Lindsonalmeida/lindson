<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Capas dos destaques da Dra. Jaci Cunha (conta Leandro, 03/11/2026). Pedido do Lindson: "vamos reorganizar os destaques".
     Referência EXTERNA: Dribbble · The Ash Branding (perfis de beleza de luxo: círculos alternando cor sólida bordô/nude e foto, uma palavra em serifada itálica).
     Identidade real da Jaci (manual v2): Bordô #6B1620, Bordô Profundo #4E0E17, Dourado #C6A06A, Champanhe #E3C9A0, Creme #F5EFE6, Nude #EDE6DE;
     Cormorant Garamond itálica + Montserrat espaçada. Tudo dentro do círculo central. Uso: destaques.html?d=0..6 (1080x1920). -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden}
.c{position:relative;width:1080px;height:1920px;overflow:hidden;display:grid;place-items:center}
.f{position:absolute;inset:0;background-size:cover}
.t{position:relative;text-align:center;z-index:2}
.n{font:600 42px Montserrat;letter-spacing:.5em;padding-left:.5em}
.w{font:italic 500 230px/0.9 'Cormorant Garamond';letter-spacing:-.01em;margin:22px 0 26px}
.l{display:flex;align-items:center;justify-content:center;gap:18px}.l i{width:110px;height:2px}.l b{width:12px;height:12px;border-radius:50%}
.s{font:600 34px Montserrat;letter-spacing:.3em;padding-left:.36em;margin-top:26px;text-transform:uppercase}
.grao{position:absolute;inset:0;opacity:.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
</style></head><body><div id="pp"></div><script>
const BO='#6B1620',BP='#4E0E17',DO='#C6A06A',CH='#E3C9A0',CR='#F5EFE6',NU='#EDE6DE',TI='#2A1A1C';
// [número, palavra, apoio, fundo, cor palavra, cor detalhe, foto?]
const D=[
 ['01','Avaliação','como funciona',`radial-gradient(70% 50% at 50% 45%,#7d1c27,${BP})`,CR,DO],
 ['02','Harmonização','orofacial',`radial-gradient(70% 50% at 50% 45%,#fbf7f1,${NU})`,BO,DO],
 ['03','Odonto','sorriso e saúde','foto:../fotos/jaci-branco-cadeira-sorrindo.jpg',CR,CH],
 ['04','Dúvidas','perguntas e respostas',`radial-gradient(70% 50% at 50% 45%,#e8d6b5,${CH})`,BP,BO],
 ['05','Pacientes','depoimentos',`radial-gradient(70% 50% at 50% 45%,#7d1c27,${BP})`,CR,DO],
 ['06','A Clínica','conheça o espaço','foto:../fotos/jaci-off-white-sofa-sorrindo.jpg',CR,CH],
 ['07','Como chegar','Zé Doca · MA',`radial-gradient(70% 50% at 50% 45%,#fbf7f1,${NU})`,BO,DO]];
const i=+new URLSearchParams(location.search).get('d')||0,[n,w,s,bg,cw,cd]=D[i];
const fundo=bg.startsWith('foto:')?`<div class="f" style="background-image:url(${bg.slice(5)});background-position:50% 22%"></div><div class="f" style="background:radial-gradient(42% 26% at 50% 50%,rgba(42,26,28,.62),rgba(42,26,28,.18) 100%),linear-gradient(180deg,rgba(78,14,23,.25),rgba(78,14,23,.45))"></div>`:`<div class="f" style="background:${bg}"></div>`;
const fs=w.length>10?168:w.length>8?196:230;
document.getElementById('pp').innerHTML=`<div class="c">${fundo}<div class="grao"></div><div class="t"><div class="n" style="color:${cd}">${n}</div><div class="w" style="color:${cw};font-size:${fs}px">${w}</div><div class="l"><i style="background:${cd}"></i><b style="background:${cd}"></b><i style="background:${cd}"></i></div><div class="s" style="color:${cw};opacity:.85">${s}</div></div></div>`;
Promise.all([document.fonts.ready,...[...document.images].map(x=>x.complete?1:new Promise(r=>{x.onload=x.onerror=r}))]).then(()=>setTimeout(()=>window.pronto=true,300));
</script></body></html>
