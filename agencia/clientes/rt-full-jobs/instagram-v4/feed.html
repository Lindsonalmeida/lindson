<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Real Time · feed v4 "luxo editorial" (30 artes) · conta Leandro, 16/11/2026.
     v3 REPROVADA ("não mude o padrão premium de marca de luxo": cartões, pílulas, setas e caixas de app).
     Padrão: Al Kántara Group v2 (agencia/marca-holding/v2/) + v5 luxo editorial do advogado + Behance Denis Bugatti 2026.
     Foto real do equipamento da RT protagonista, com grade de cinema (verde do chroma tirado para petróleo escuro), fundo Preto Set,
     1 acento só (Azul Real), Geist leve gigante com kerning negativo, fios finos, rótulos mono pequenos. Sem caixa, pílula, seta, cartão.
     5 composições (ver TEMPLATE.md): 1 Leica "full-bleed + manchete baixa" · 2 ARRI "coluna editorial + foto sangrada" ·
     3 Hasselblad "palavra translúcida gigante + produto" · 4 RED "foto alta + ficha em fios" (página clara Branco Luz) · 5 Bugatti "pergunta gigante".
     Uso: feed.html?n=1..30 -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--pt:#05070B;--b:#F4F7FB;--az:#2E9BFF;--rec:#FF3B3B;--cz:rgba(244,247,251,.62)}
*{box-sizing:border-box;margin:0;padding:0}body{width:1080px;height:1350px;overflow:hidden;font-family:Geist,sans-serif;-webkit-font-smoothing:antialiased}
.p{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--pt);color:var(--b)}
.a{position:absolute}.m{font:400 19px 'Geist Mono';letter-spacing:.28em;text-transform:uppercase}
.h{font-weight:200;letter-spacing:-.055em;line-height:.9}.h b{font-weight:300;color:var(--az)}
.fio{height:1px;background:currentColor;opacity:.35}
.grao{inset:0;opacity:.11;mix-blend-mode:overlay;pointer-events:none;z-index:9;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
/* grade de cinema: tira o verde do chroma, contraste e sombra petróleo */
.gr{object-fit:cover;filter:hue-rotate(95deg) saturate(.42) contrast(1.22) brightness(.62)}
.tint{mix-blend-mode:color;background:#0b2a44;opacity:.55}
</style></head><body><div id="pp"></div><script src="dados.js"></script><script>
const M='../identidade/v1/marca/',F='../instagram-v3/fotos/';
const n=+new URLSearchParams(location.search).get('n')||1,[rot,tit0,sub,at,ft,L0,ex,o]=D[n-1],num=String(n).padStart(2,'0'),img=F+ft+'.jpg';
const tit=tit0==='LUZ'?'Kit [luz]':L0==='D'?`${tit0[0]+tit0.slice(1).toLowerCase()} [${ex.toLowerCase()}]`:tit0;
const T=t=>t.replace(/\[(.+?)\]/g,'<b>$1</b>');
const L=['1','2','3','4','5'][(n-1)%5];
const foto=(st,pos)=>`<img class="a gr" src="${img}" style="${st};object-position:${pos||o.pos||'50% 50%'}"><div class="a tint" style="${st}"></div>`;
const marca=(cl)=>`<img class="a" src="${M}${cl?'assinatura-horizontal-claro':'assinatura-horizontal'}.svg" style="left:72px;top:64px;height:40px">`;
const cab=(cl)=>`${marca(cl)}<div class="a m" style="right:72px;top:76px;color:${cl?'#05070B':'var(--b)'};opacity:.75"><span style="color:var(--rec)">●</span>&nbsp; ${rot}</div>`;
const pe=(cl)=>`<div class="a" style="left:72px;right:72px;bottom:64px;color:${cl?'#05070B':'var(--b)'}"><div class="fio"></div><div style="display:flex;justify-content:space-between;margin-top:20px" class="m"><span style="opacity:.8">Reservas · (98) 99133-1727</span><span style="opacity:.55">Nº ${num} / 30</span></div></div>`;
const at2=at.length>3&&at.every(x=>/^\d+$/.test(x[0])||x[1]==='mm')?[['Focais',at.map(x=>x[0]).join(' · ')+(at[0][1]==='mm'?' mm':'')]]:at;
const ficha=(cl,w)=>at2.length?`<div style="width:${w||'100%'}">${at2.slice(0,3).map(([k,v])=>`<div style="display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-top:1px solid ${cl?'rgba(5,7,11,.22)':'rgba(244,247,251,.22)'}"><span class="m" style="font-size:15px;opacity:.6">${k}</span><span style="font:300 30px Geist;letter-spacing:-.02em">${v}</span></div>`).join('')}</div>`:'';
const sz=t=>{const l=t.replace(/\[|\]/g,'').length;return l>18?104:l>13?126:150};
let H='';
if(L==='1')H=`<div class="p">${foto('inset:0;width:1080px;height:1350px')}
<div class="a" style="inset:0;background:linear-gradient(180deg,rgba(5,7,11,.75),rgba(5,7,11,0) 26%,rgba(5,7,11,.15) 48%,rgba(5,7,11,.97) 86%)"></div>${cab()}
<div class="a" style="left:66px;right:60px;bottom:160px"><div class="h" style="font-size:${sz(tit)}px">${T(tit)}</div><div style="width:720px;margin:34px 0 0 6px;font:300 30px/1.45 Geist;color:var(--cz)">${sub}</div></div>${pe()}<div class="a grao"></div></div>`;
if(L==='2')H=`<div class="p">${foto('left:430px;top:0;width:650px;height:1350px')}
<div class="a" style="left:430px;top:0;width:260px;height:1350px;background:linear-gradient(90deg,#05070B,rgba(5,7,11,0))"></div>${cab()}
<div class="a m" style="left:72px;top:250px;color:var(--az)">${num} — Real Time</div>
<div class="a h" style="left:66px;top:300px;width:700px;font-size:${Math.min(sz(tit),118)}px">${T(tit)}</div>
<div class="a" style="left:72px;top:700px;width:470px;font:300 27px/1.5 Geist;color:var(--cz)">${sub}</div>
<div class="a" style="left:72px;top:900px;width:470px">${ficha()}</div>${pe()}<div class="a grao"></div></div>`;
if(L==='3'){const w=(tit.match(/\[(.+?)\]/)||[0,tit])[1].split(/[ -]/)[0].toUpperCase();H=`<div class="p">${cab()}
<div class="a" style="left:-20px;right:-20px;top:150px;text-align:center;font:600 ${w.length>7?250:330}px/1 Geist;letter-spacing:-.07em;color:transparent;-webkit-text-stroke:1.5px rgba(244,247,251,.16);white-space:nowrap">${w}</div>
${foto('left:140px;top:330px;width:800px;height:560px')}<div class="a" style="left:140px;top:330px;width:800px;height:560px;box-shadow:inset 0 0 120px 40px #05070B"></div>
<div class="a h" style="left:0;right:0;top:930px;text-align:center;font-size:${Math.min(sz(tit),110)}px">${T(tit)}</div>
<div class="a" style="left:180px;right:180px;top:1110px;text-align:center;font:300 26px/1.45 Geist;color:var(--cz)">${sub}</div>${pe()}<div class="a grao"></div></div>`}
if(L==='4')H=`<div class="p" style="background:#EEF1F5;color:#05070B">${foto('left:0;top:0;width:1080px;height:760px')}
<div class="a" style="left:0;right:0;top:0;height:220px;background:linear-gradient(180deg,rgba(5,7,11,.7),transparent)"></div>${marca()}<div class="a m" style="right:72px;top:76px;color:var(--b);opacity:.8"><span style="color:var(--rec)">●</span>&nbsp; ${rot}</div>
<div class="a h" style="left:66px;top:800px;width:560px;font-size:${Math.min(sz(tit),96)}px;font-weight:300">${T(tit).replace('<b>','<b style="color:#1b6fd1">')}</div>
<div class="a" style="left:660px;right:72px;top:808px">${at.length?ficha(1):`<div style="font:300 27px/1.5 Geist;color:#3a404b">${sub}</div>`}</div>
${at.length?`<div class="a" style="left:72px;width:520px;top:1080px;font:300 25px/1.5 Geist;color:#3a404b">${sub}</div>`:''}${pe(1)}<div class="a grao" style="opacity:.06"></div></div>`;
if(L==='5')H=`<div class="p">${foto('left:0;top:640px;width:1080px;height:710px','50% 45%')}
<div class="a" style="left:0;right:0;top:600px;height:750px;background:linear-gradient(180deg,#05070B 0,rgba(5,7,11,.2) 30%,rgba(5,7,11,.3) 70%,#05070B 96%)"></div>${cab()}
<div class="a h" style="left:66px;right:60px;top:200px;font-size:${sz(tit)}px">${T(tit)}</div>
<div class="a" style="left:72px;top:${sz(tit)>120?470:520}px;width:760px;font:300 28px/1.5 Geist;color:var(--cz)">${sub}</div>${pe()}<div class="a grao"></div></div>`;
document.getElementById('pp').innerHTML=H;
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>window.pronto=true);
</script></body></html>
