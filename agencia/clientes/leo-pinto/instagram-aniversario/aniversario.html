<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- MODELO ÚNICO de aniversário (todos os aniversariantes) · Vereador Leo Pinto · conta Leandro, 03/11/2026.
     Pedido do Lindson: "crie um modelo que será usado para todos os aniversariantes" + "siga a regra de sempre buscar referências premium".
     Composição COPIADA do Designi "Feliz Aniversário Paulo André" (versões vermelha #7beb9a880084f979 e azul #207f3a863447dadf; capturas em referencias/):
     rótulo "FELIZ" em caixa, "ANIVERSÁRIO" condensado gigante, NOME em amarelo condensado logo abaixo, selo com a data, pessoa recortada grande
     na frente saindo pela base, assinatura na base. Adaptado às regras do Leo: sem estrelinhas/brilhos (grafismos proibidos), Anton + Kaushan + Montserrat,
     laranja (principal) ou azul (quando a roupa da pessoa é laranja), logo LEO PINTO aplicada direto (sem placa), @ com avatar no topo.
     Os dados entram por window.DADOS (ver gerar.js). Nada de foto de pessoa no Git. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{width:1080px;height:1350px;overflow:hidden;font-family:Montserrat,sans-serif}
.arte{position:relative;width:1080px;height:1350px;overflow:hidden}
.azul{background:radial-gradient(1100px 1000px at 50% 30%,#4A78FF 0,#2E5BFA 26%,#2350F5 46%,#1539BE 72%,#082063 100%)}
.laranja{background:radial-gradient(1000px 900px at 50% 25%,#FFC84A 0,#FFA526 28%,#FF8A1F 52%,#FF7A1A 74%,#E8590C 100%)}
.a{position:absolute}
.grao{inset:0;opacity:.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.eco{left:-40px;right:-40px;top:470px;text-align:center;font:400 330px/0.86 Anton;color:rgba(255,255,255,.07);white-space:nowrap;text-transform:uppercase}
.pill{left:50%;transform:translateX(-50%);top:46px;display:flex;align-items:center;gap:12px;background:rgba(5,49,110,.55);color:#fff;font:700 22px Montserrat;padding:6px 22px 6px 6px;border-radius:99px;white-space:nowrap}
.pill img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #FFC20E}
.feliz{left:50%;transform:translateX(-50%) rotate(-3deg);top:138px;background:#05316E;color:#fff;font:400 44px Anton;letter-spacing:.16em;padding:6px 22px 2px 30px}
.tit{left:0;right:0;text-align:center;transform:rotate(-3deg);font-family:Anton;text-transform:uppercase;line-height:.9;white-space:nowrap}
.data{background:#fff;color:#05316E;font:900 24px Montserrat;letter-spacing:.06em;padding:8px 18px;border-radius:99px;transform:rotate(-3deg);white-space:nowrap}
.pessoa{left:50%;transform:translateX(-50%);filter:drop-shadow(0 30px 46px rgba(2,12,50,.45))}
.base{left:0;right:0;bottom:0;height:330px;background:linear-gradient(180deg,transparent,rgba(5,20,70,.78))}
.laranja .base{background:linear-gradient(180deg,transparent,rgba(120,40,0,.55))}
.frase{right:60px;bottom:66px;width:430px;text-align:right;color:#fff;font:500 25px/1.4 Montserrat;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.frase .k{display:block;font:400 54px/1 'Kaushan Script';color:#FFC20E;margin-bottom:8px}
.logo{left:56px;bottom:52px;width:250px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
</style></head><body><div id="arte"></div>
<script>
const d=window.DADOS, cor=d.cor||'laranja', A=d.amarelo||'#FFC20E';
document.getElementById('arte').innerHTML=`<div class="arte ${cor}"><div class="a grao"></div>
<div class="a eco">${d.nome1}</div>
<div class="a pill"><img src="${d.avatar}">@_leonardopinto</div>
<div class="a feliz">FELIZ</div>
<div class="a tit" id="t1" style="top:206px;color:#fff;font-size:178px">ANIVERSÁRIO</div>
<div class="a tit" id="t2" style="top:368px;color:${cor==='laranja'?'#05316E':A};font-size:150px">${d.nome1} ${d.nome2||''}</div>
${d.data?`<div class="a data" id="dt">● ${d.data}</div>`:''}
<img class="a pessoa" src="${d.foto}" style="top:${d.topo||520}px;width:${d.largura||820}px;margin-left:${d.dx||0}px">
<div class="a base"></div>
<img class="a logo" src="${cor==='laranja'?d.logoMarinho:d.logo}">
<div class="a frase"><span class="k">${d.chamada||'Parabéns!'}</span>${d.frase}</div></div>`;
// nome e título sempre cabem na largura (nome longo diminui sozinho); mede só depois de a Anton carregar
const caber=(e,max)=>{const sp=document.createElement('span');sp.textContent=e.textContent;sp.style.cssText='font:inherit;white-space:nowrap';e.textContent='';e.appendChild(sp);let f=parseFloat(e.style.fontSize);while(sp.offsetWidth>max&&f>60){f-=3;e.style.fontSize=f+'px'}};
document.fonts.load('150px Anton').then(()=>document.fonts.ready).then(()=>{caber(document.getElementById('t1'),900);caber(document.getElementById('t2'),960);
 const T2=document.getElementById('t2'),sp=T2.firstChild,dt=document.getElementById('dt');if(dt){dt.style.left=(540+sp.offsetWidth/2-dt.offsetWidth-6)+'px';dt.style.top=(T2.offsetTop+T2.offsetHeight-2)+'px'}
 window.pronto=true});
</script></body></html>
