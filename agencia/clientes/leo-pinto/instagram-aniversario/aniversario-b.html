<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Modelo B de aniversário (editorial claro) · Leo Pinto · conta Leandro, 03/11/2026. Lindson: "crie mais dois modelos… ele não gostou dessa".
     Copiado de modelos EXTERNOS do Designi: "Feliz Aniversário João Cláudio" (#47596547d980596e: fundo claro, "Parabéns" condensado gigante atrás da cabeça,
     "FELIZ ANIVERSÁRIO" pequeno espaçado em cima, frase em linhas grifadas à esquerda, pílula com o nome no peito, rodapé de assinatura) +
     "Vereador Gustavo José" (#1abf03c331f9ccbe: palavra repetida em degradê sumindo atrás da pessoa, "Feliz Aniversário" manuscrito embaixo).
     Identidade do Leo; sem balões, chapéu, corações ou ícones. Dados por window.DADOS (gerar.js, "modelo":"b"; "story":true gera 1080x1920 com áreas seguras do story). -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{width:1080px;height:auto;overflow:hidden;font-family:Montserrat}
.arte{position:relative;width:1080px;height:1350px;overflow:hidden;background:radial-gradient(900px 700px at 50% 40%,#FFFFFF 0,#FFF6EA 45%,#FFE3C4 100%)}
.a{position:absolute}
.grao{inset:0;opacity:.10;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.luz{left:140px;top:300px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(255,154,34,.35),rgba(255,154,34,0) 65%)}
.topo{left:0;right:0;top:112px;text-align:center;font:900 26px Montserrat;letter-spacing:.62em;padding-left:.62em;color:#05316E}
.eco{left:0;right:0;text-align:center;font:400 270px/1.02 Anton;text-transform:uppercase;white-space:nowrap}
.e1{top:150px;background:linear-gradient(180deg,#FF7A1A 20%,#E8590C);-webkit-background-clip:text;background-clip:text;color:transparent}
.e2{top:372px;color:transparent;-webkit-text-stroke:3px rgba(255,122,26,.45)}
.e3{top:594px;color:transparent;-webkit-text-stroke:3px rgba(255,122,26,.18)}
.pessoa{left:50%;transform:translateX(-50%);filter:drop-shadow(0 30px 40px rgba(120,50,0,.28))}
.chao{left:0;right:0;bottom:0;height:190px;background:linear-gradient(180deg,rgba(255,246,234,0),#FFF6EA 80%)}
.frase{left:56px;top:520px;width:300px}
.frase span{background:#FF7A1A;color:#fff;font:800 22px/1.85 Montserrat;padding:4px 10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.data{right:56px;top:520px;text-align:right;font:900 22px/1.3 Montserrat;color:#05316E;letter-spacing:.06em}
.data b{display:block;font:400 64px/1 Anton;color:#2350F5;letter-spacing:0}
.nome{left:50%;transform:translateX(-50%);bottom:290px;background:#05316E;color:#fff;border-radius:99px;padding:20px 46px 16px;text-align:center;white-space:nowrap;box-shadow:0 24px 40px -18px rgba(5,49,110,.6)}
.nome b{display:block;font:400 64px/1 Anton;text-transform:uppercase;letter-spacing:.01em}
.nome i{display:block;font:700 18px Montserrat;font-style:normal;letter-spacing:.3em;color:#FFC20E;margin-top:6px}
.script{left:0;right:0;bottom:170px;text-align:center;font:400 92px/1 'Kaushan Script';text-shadow:0 4px 18px rgba(255,246,234,.95);color:#05316E;transform:rotate(-4deg)}
.pill{left:56px;top:40px;display:flex;align-items:center;gap:12px;background:#fff;color:#05316E;font:700 22px Montserrat;padding:6px 22px 6px 6px;border-radius:99px;box-shadow:0 10px 20px -12px rgba(5,49,110,.5)}
.pill img{width:46px;height:46px;border-radius:50%;object-fit:cover}
.rod{left:56px;right:56px;bottom:40px;display:flex;justify-content:space-between;align-items:center;font:700 19px Montserrat;color:#05316E}
.rod img{width:170px}
.st{height:1920px}
.st .topo{top:300px}.st .e1{top:338px}.st .e2{top:560px}.st .e3{top:782px}.st .luz{top:500px}
.st .frase{top:720px}.st .data{top:720px}.st .pill{top:150px}
.st .nome{bottom:520px}.st .script{bottom:400px}.st .rod{bottom:250px}.st .chao{height:640px;background:linear-gradient(180deg,rgba(255,246,234,0),#FFF6EA 45%)}
</style></head><body><div id="arte"></div><script>
const d=window.DADOS,nome=(d.nome1+' '+(d.nome2||'')).trim();
const frase=(d.frase||'').split('|').map(t=>`<span>${t.trim()}</span>`).join('<br>');
const [dia,mes]=(d.dataCurta||'').split(' ');
document.getElementById('arte').innerHTML=`<div class="arte${d.story?' st':''}"><div class="a grao"></div><div class="a luz"></div>
<div class="a pill"><img src="${d.avatar}">@_leonardopinto</div>
<div class="a topo">FELIZ ANIVERSÁRIO</div>
<div class="a eco e1">PARABÉNS</div><div class="a eco e2">PARABÉNS</div><div class="a eco e3">PARABÉNS</div>
<img class="a pessoa" src="${d.foto}" style="top:${d.story?(d.topoStory||520):(d.topoB||300)}px;width:${d.story?(d.larguraStory||1000):(d.larguraB||900)}px;margin-left:${d.dx||0}px">
<div class="a chao"></div>
${frase?`<div class="a frase">${frase}</div>`:''}
${dia?`<div class="a data"><b>${dia}</b>${mes||''}</div>`:''}
<div class="a nome" id="nm"><b>${nome}</b><i>${d.subtitulo||'HOJE É O SEU DIA'}</i></div>
<div class="a script">${d.chamada||'Parabéns!'}</div>
<div class="a rod"><span>${d.assinatura||'Um abraço do amigo Leo'}</span><img src="${d.logoMarinho}"></div></div>`;
document.fonts.load('64px Anton').then(()=>document.fonts.ready).then(()=>{const n=document.querySelector('#nm b');let f=64;while(n.offsetWidth>860&&f>36){f-=2;n.style.fontSize=f+'px'}window.pronto=true});
</script></body></html>
