<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Leo Pinto Motion v1</title>
<meta name="viewport" content="width=1080">
<script>
// fontes locais (pasta de assets fora do Git); ver README para baixar
const A_ = new URLSearchParams(location.search).get('a') || '../assets';
document.write(`<style>
@font-face{font-family:Anton;src:url(${A_}/fonts/Anton.ttf)}
@font-face{font-family:'Kaushan Script';src:url(${A_}/fonts/Kaushan.ttf)}
@font-face{font-family:Montserrat;font-weight:600;src:url(${A_}/fonts/M600.ttf)}
@font-face{font-family:Montserrat;font-weight:700;src:url(${A_}/fonts/M700.ttf)}
@font-face{font-family:Montserrat;font-weight:900;src:url(${A_}/fonts/M900.ttf)}
</style>`);
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#082063;width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
 background:radial-gradient(1500px 1300px at 560px 760px,#4A78FF 0,#2E5BFA 24%,#2350F5 42%,#1539BE 66%,#0B2A8A 86%,#082063 100%)}
#light{position:absolute;inset:-200px;background:linear-gradient(118deg,rgba(255,255,255,0) 48%,rgba(255,255,255,.07) 62%,rgba(3,18,70,.38) 100%)}
#cam{position:absolute;inset:0;transform-origin:540px 960px}
#glow{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none;z-index:40;display:none}
#grain{position:absolute;inset:0;opacity:.10;mix-blend-mode:overlay;pointer-events:none;z-index:50;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.S{position:absolute;inset:0;transform-origin:540px 960px}
.L{position:absolute;transform-origin:50% 50%}
.B{font-family:Montserrat;font-weight:900;text-transform:uppercase;line-height:.95;letter-spacing:-.02em;color:#fff}
.A{font-family:Anton;text-transform:uppercase;line-height:.9;color:#fff}
.K{font-family:'Kaushan Script';line-height:1.1;color:#fff;text-transform:none}
.Lb{font-family:Montserrat;font-weight:700;text-transform:uppercase;letter-spacing:.38em;white-space:nowrap;color:#fff}
.stack{text-align:center}
.stack .row{white-space:nowrap}
.p{display:inline-block;transform-origin:50% 70%}
.y{color:#FFC20E}.o{color:#FF7A1A}.w{color:#fff}.r{color:#2350F5}.m{color:#082063}
.g{background:linear-gradient(180deg,#FFE066,#FFC20E 45%,#FF7A1A);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .04em}
.sh{filter:drop-shadow(0 14px 26px rgba(2,12,50,.42))}
.box{box-shadow:0 26px 44px -24px rgba(2,12,50,.75)}
.dg{display:inline-block;width:.56em;text-align:center}
.cur{display:inline-block;width:0;position:relative}
.cur::after{content:'';position:absolute;left:.06em;top:-.82em;width:.09em;height:.95em;background:#082063}
.cw .cur::after{background:#FFC20E}
</style></head>
<body><div id="stage"><div id="cam"><div id="light"></div></div><div id="glow"></div><div id="grain"></div></div>
<svg id="defs" width="0" height="0" style="position:absolute"><defs></defs></svg>
<script src="engine.js"></script>
</body></html>
