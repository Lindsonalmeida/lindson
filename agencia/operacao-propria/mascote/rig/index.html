<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seu Turbo · rig</title>
<!-- Rig ao vivo do Seu Turbo (conta Pedro, 15/11/2026): parado (respira e pisca), aceno, aponta, joinha e fala com áudio. -->
<style>
:root{--t:#C8302B;--v:#1E5B3B;--c:#F3EEE6;--k:#141311;--a:#F2B33D}
body{margin:0;background:var(--v);color:var(--c);font:600 15px system-ui;display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:100vh}
@media(max-width:720px){body{grid-template-columns:1fr}}
#palco{display:flex;align-items:center;justify-content:center;padding:16px}svg{width:min(70vh,100%);height:auto;max-height:92vh}
aside{background:var(--k);padding:20px;display:flex;flex-direction:column;gap:10px}
button,select{background:var(--c);color:var(--k);border:3px solid var(--k);border-radius:12px;padding:10px;font:700 15px system-ui;cursor:pointer}
button.on{background:var(--a)}h1{margin:0 0 6px;color:var(--a)}label{font-size:13px;opacity:.8}
</style></head><body><div id="palco"><svg id="st"></svg></div>
<aside><h1>Seu Turbo</h1>
<label>Gesto</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="poses"></div>
<label>Expressão</label><select id="expr"></select>
<label>Fala: escolha um áudio (mp3/wav)</label><input type="file" id="aud" accept="audio/*">
<button id="mic">Falar pelo microfone</button>
<label>Boca manual (lip-sync)</label><select id="boca"><option value="">automática</option></select>
</aside>
<script src="seu-turbo.js"></script>
<script>
const T=SeuTurbo.criar(document.getElementById('st'));let pose='neutro',expr='neutro',bocaFixa='',an=null,buf=null;
const P=document.getElementById('poses');['neutro','aceno','aponta','joinha','pensando','confiante','apresenta'].forEach(p=>{const b=document.createElement('button');b.textContent=p;b.onclick=()=>{pose=p;[...P.children].forEach(x=>x.classList.toggle('on',x===b))};P.appendChild(b)});
const E=document.getElementById('expr');Object.keys(SeuTurboExpr).forEach(e=>E.add(new Option(e,e)));E.onchange=()=>expr=E.value;
const B=document.getElementById('boca');SeuTurboBocas.forEach(b=>B.add(new Option(b,b)));B.onchange=()=>bocaFixa=B.value;
function liga(fonte,ctx){an=ctx.createAnalyser();an.fftSize=1024;buf=new Float32Array(an.fftSize);fonte.connect(an)}
document.getElementById('aud').onchange=e=>{const ctx=new AudioContext();const a=new Audio(URL.createObjectURL(e.target.files[0]));const s=ctx.createMediaElementSource(a);liga(s,ctx);s.connect(ctx.destination);a.play()};
document.getElementById('mic').onclick=async()=>{const ctx=new AudioContext();const m=await navigator.mediaDevices.getUserMedia({audio:true});liga(ctx.createMediaStreamSource(m),ctx)};
function loop(ms){const t=ms/1000;let boca=bocaFixa||null;
  if(!boca&&an){an.getFloatTimeDomainData(buf);let r=0,z=0;for(let i=0;i<buf.length;i++){r+=buf[i]*buf[i];if(i&&(buf[i]>0)!==(buf[i-1]>0))z++}r=Math.min(1,Math.sqrt(r/buf.length)*6);boca=SeuTurbo.visema(r,Math.min(1,z/buf.length/.35),t*9);if(boca==='repouso')boca=null}
  const R=pose==='aceno'?{giro:12+Math.sin(t*14)*18}:{};
  T.aplicar({pose,expr,boca,R,respira:Math.sin(t*2.2),piscar:SeuTurbo.piscada(t),inclina:Math.sin(t*1.6)*2});requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
