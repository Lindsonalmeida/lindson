<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>

ex1:papo({f:'c07.jpg',h:'Faça uma oferta tão boa que ele se sinta <span class="cx">burro</span> de dizer não.',au:'ALEX HORMOZI · $100M OFFERS',np:'Se o cliente some depois do orçamento, o problema não é o preço.'}),
