<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Capas da área de membros (estilo Netflix) dos produtos low ticket do Lindson (conta Pedro, 04/11/2026).
     Pedido: "quero uma área de membros também, no estilo Netflix, pode usar minhas fotos". Referência enviada por ele: área de membros da Hubla
     (app.hub.la, "ai creator PRO": banner grande com a pessoa + botão, fileira de "Módulos" em cartões verticais com a pessoa e o título gigante
     embaixo, selo no topo, barra de progresso; "Outros Produtos" em cartões deitados com "Comprar por R$"). Copiado na marca v2 preto e amarelo,
     com o eco empilhado do AMPLIFY (Peno Lab) e os recortes BiRefNet das fotos dele. Uso: membros.html?a=hero | v-<slug> | h-<slug> -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{background:#000;overflow:hidden}
.a{position:relative;overflow:hidden;background:#070707;color:#F5F3EE;font-family:Manrope}.abs{position:absolute}
.am{background:radial-gradient(70% 55% at 50% 35%,#FFE066,#F5C518 55%,#D69E06)}
.grao{position:absolute;inset:0;background:url(../../../../centrallindsonalmeida/produtos/kit-mes-pronto/fonte/grao.png);opacity:.55;mix-blend-mode:overlay;pointer-events:none}
.selo{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#F5C518;color:#0A0A0A;font:400 40px/1 Anton;padding:16px 16px 12px}
.ant{font-family:Anton;text-transform:uppercase;line-height:.86}
.ouro{background:linear-gradient(180deg,#FFF1B0,#F5C518 45%,#E09600);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{display:inline-block;background:#F5C518;color:#0A0A0A;font:700 18px 'JetBrains Mono';letter-spacing:.12em;border-radius:99px;padding:8px 18px}
</style></head><body><div id="x"></div><script>
const F='fotos/',A=new URLSearchParams(location.search).get('a')||'hero';
// produto: título em 2 linhas, foto (recorte BiRefNet, quadro inteiro 1170x2048), fundo (p = preto com brilho, a = amarelo)
const P={'kit-mes-pronto':['KIT','MÊS PRONTO','c05','p'],'kit-whatsapp-que-fecha':['WHATSAPP','QUE FECHA','c01','a'],'kit-prospeccao':['100','MENSAGENS QUE ABREM CONVERSA','c03','p'],
 'raio-x-do-perfil':['RAIO-X','DO PERFIL','c09','a'],'bio-que-vende':['BIO','QUE VENDE','c04','p']};
const fundo=t=>t==='a'?'<div class="abs am" style="inset:0"></div>':'<div class="abs" style="inset:0;background:radial-gradient(70% 50% at 50% 30%,rgba(245,197,24,.45),rgba(245,150,0,.12) 50%,transparent 75%),#070707"></div>';
const S={};
for(const [k,[t1,t2,f,c]] of Object.entries(P)){
 const escuro=c==='p';
 // capa vertical 600x1000 (fileira "Módulos")
 S['v-'+k]=`<div class="a" style="width:600px;height:1000px">${fundo(c)}
  <div class="abs ant" style="left:0;right:0;top:120px;text-align:center;font-size:${t1.length>7?150:230}px;color:${escuro?'transparent':'rgba(10,10,10,.14)'};${escuro?'-webkit-text-stroke:2px rgba(245,197,24,.35)':''}">${t1}</div>
  <img class="abs" src="${F}${f}-full.png" style="left:-240px;top:120px;width:1080px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))">
  <div class="abs" style="left:0;right:0;bottom:0;height:470px;background:linear-gradient(180deg,transparent,rgba(7,7,7,.96) 55%)"></div>
  <div class="abs" style="left:0;right:0;bottom:120px;text-align:center"><div class="ant ouro" style="font-size:${t1.length>7?96:120}px">${t1}</div><div style="font:700 44px/1 Manrope;letter-spacing:-.02em;margin-top:8px">${t2}</div></div>
  <div class="abs" style="left:0;right:0;bottom:52px;text-align:center"><span class="tag">LINDSON ALMEIDA</span></div>
  <div class="selo">LA</div><div class="grao"></div></div>`;
 // capa deitada 830x440 ("Outros produtos")
 S['h-'+k]=`<div class="a" style="width:830px;height:440px">${fundo(c)}
  <img class="abs" src="${F}${f}-full.png" style="left:330px;top:40px;width:760px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.5))">
  <div class="abs" style="inset:0;background:linear-gradient(90deg,${escuro?'rgba(7,7,7,.95) 38%':'rgba(245,197,24,.0) 38%'},transparent 70%)"></div>
  <div class="abs" style="left:46px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;color:${escuro?'#F5F3EE':'#0A0A0A'}"><div class="ant ${escuro?'ouro':''}" style="font-size:${t1.length>7?84:110}px;${escuro?'':'color:#0A0A0A'}">${t1}</div><div style="font:800 40px/1.05 Manrope;letter-spacing:-.03em;margin-top:6px">${t2}</div></div>
  <div class="grao"></div></div>`;
}
// banner principal 1920x760
S.hero=`<div class="a" style="width:1920px;height:760px"><div class="abs" style="inset:0;background:radial-gradient(45% 80% at 72% 40%,rgba(245,197,24,.5),rgba(245,150,0,.12) 50%,transparent 75%),#070707"></div>
 <div class="abs ant" style="right:-40px;top:40px;font-size:420px;color:transparent;-webkit-text-stroke:2px rgba(245,197,24,.28)">VENDA</div>
 <img class="abs" src="${F}c05-full.png" style="left:960px;top:20px;width:1100px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.6))">
 <div class="abs" style="inset:0;background:linear-gradient(90deg,rgba(7,7,7,.98) 30%,rgba(7,7,7,.2) 60%,transparent),linear-gradient(0deg,rgba(7,7,7,.9),transparent 35%)"></div>
 <div class="abs" style="left:110px;top:170px"><span class="tag">ÁREA DE MEMBROS</span><div style="font:800 96px/1 Manrope;letter-spacing:-.045em;margin-top:30px">Seu Instagram<br>que <span class="ouro" style="font-family:Anton;font-weight:400;font-size:118px">VENDE</span>.</div>
 <p style="font:500 30px/1.45 Manrope;color:#A7A39A;margin-top:24px;max-width:720px">Kits prontos para o dono de negócio: roteiros, mensagens e o passo a passo, do perfil ao WhatsApp.</p></div>
 <div class="grao"></div></div>`;
document.getElementById('x').innerHTML=S[A]||'';
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>setTimeout(()=>window.pronto=true,300));
</script></body></html>
