<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Artes-chave (pôsteres 2:3 e miniaturas 16:9) da área de membros · estilo NEXUS aprovado (conta Pedro, 04/11/2026).
     Pedidos do Lindson (04/11): "pode usar imagens cinematográficas de banco ou de IA, tudo dentro da identidade"; "seja simétrico em tudo e deixe as
     fotos todas alinhadas"; "não repita fotos"; "busto pra cima, preencha quase toda a arte com a minha imagem".
     Cenas: geradas por IA na Figma (gpt-image), sem pessoas, preto e amarelo (artes-v1/fotos/cenas/). Rosto: recorte BiRefNet das fotos reais dele,
     sempre no eixo central, mesma escala (ombros = 70% da largura) e cabeça na mesma altura em todas as peças. Uso: keyart.html?a=p-<slug> | t-<slug> -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{background:#000;overflow:hidden}
.a{position:relative;overflow:hidden;background:#07090C;color:#F5F3EE;font-family:Manrope}.abs{position:absolute}
.cena{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.9) contrast(1.05)}
.ant{font-family:Anton;text-transform:uppercase;line-height:.88;letter-spacing:.01em}
.mono{font-family:'JetBrains Mono';letter-spacing:.42em}
.grao{position:absolute;inset:0;background:url(/home/user/centrallindsonalmeida/produtos/kit-mes-pronto/fonte/grao.png);opacity:.45;mix-blend-mode:overlay;pointer-events:none}
</style></head><body><div id="x"></div><script>
const F='../artes-v1/fotos/',A=new URLSearchParams(location.search).get('a')||'p-kit-mes-pronto';
// produto: [linha 1, linha 2, slogan, cena, recorte]
const P={'kit-mes-pronto':['KIT MÊS','PRONTO','O MÊS DE INSTAGRAM PRONTO','ep-alicerce','c03'],
 'kit-whatsapp-que-fecha':['WHATSAPP','QUE FECHA','DO OI ATÉ A VENDA','ep-ponte','c01'],
 'kit-prospeccao':['KIT','PROSPECÇÃO','100 MENSAGENS QUE ABREM CONVERSA','ep-torre','c00'],
 'raio-x-do-perfil':['RAIO-X','DO PERFIL','O SEU PERFIL ANALISADO','ep-planta','c05'],
 'bio-que-vende':['BIO QUE','VENDE','A SUA BIO EM 15 MINUTOS','ep-portal','c04']};
Promise.resolve({"c00": {"w": 1170, "h": 2048, "top": 121, "cx": 584.0, "ombro": 530, "alt": 1879}, "c01": {"w": 1170, "h": 2048, "top": 239, "cx": 600.5, "ombro": 487, "alt": 1712}, "c02": {"w": 1170, "h": 2048, "top": 179, "cx": 586.5, "ombro": 447, "alt": 1839}, "c03": {"w": 1170, "h": 2048, "top": 276, "cx": 615.5, "ombro": 429, "alt": 1719}, "c04": {"w": 1170, "h": 2048, "top": 178, "cx": 586.5, "ombro": 447, "alt": 1840}, "c05": {"w": 1170, "h": 2048, "top": 228, "cx": 604.5, "ombro": 497, "alt": 1763}, "c06": {"w": 1170, "h": 2048, "top": 498, "cx": 592.5, "ombro": 453, "alt": 1308}, "c09": {"w": 1143, "h": 2048, "top": 292, "cx": 575.5, "ombro": 285, "alt": 1756}}).then(RC=>{
 const [tipo,...k]=A.split('-'),slug=k.join('-'),[l1,l2,slo,cena,rc]=P[slug],R=RC[rc];
 const W=tipo==='p'?1000:1280,H=tipo==='p'?1500:720;
 const om=tipo==='p'?.70:.36, topo=tipo==='p'?.12:.10;           // mesma escala e mesma altura da cabeça em todas
 const s=W*om/R.ombro, left=W/2-R.cx*s, top=H*topo-R.top*s;
 const pessoa=`<img class="abs" src="${F}${rc}-full.png" style="left:${left}px;top:${top}px;width:${R.w*s}px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.6)) brightness(.95)">`;
 const luz=`<div class="abs" style="left:${W/2-W*.45}px;top:${H*.05}px;width:${W*.9}px;height:${W*.9}px;border-radius:50%;background:radial-gradient(closest-side,rgba(245,197,24,.35),transparent);filter:blur(10px)"></div>`;
 let html;
 if(tipo==='p') html=`<div class="a" style="width:${W}px;height:${H}px"><div class="cena" style="background-image:url(${F}cenas/${cena}.png)"></div>${luz}${pessoa}
  <div class="abs" style="inset:0;background:linear-gradient(0deg,#07090C 6%,rgba(7,9,12,.85) 26%,rgba(7,9,12,0) 52%),linear-gradient(180deg,rgba(7,9,12,.75),transparent 18%)"></div>
  <div class="abs mono" style="left:0;right:0;top:56px;text-align:center;font-size:20px;color:#F5C518">ESTADO PRÓPRIO ▲</div>
  <div class="abs" style="left:0;right:0;bottom:150px;text-align:center"><div class="ant" style="font-size:150px">${l1}</div><div class="ant" style="font-size:96px;color:#F5C518">${l2}</div></div>
  <div class="abs mono" style="left:0;right:0;bottom:80px;text-align:center;font-size:18px;color:#cfd3d8">${slo}</div><div class="grao"></div></div>`;
 else html=`<div class="a" style="width:${W}px;height:${H}px"><div class="cena" style="background-image:url(${F}cenas/${cena}.png);background-position:center 40%"></div>${luz}${pessoa}
  <div class="abs" style="inset:0;background:linear-gradient(0deg,#07090C 4%,rgba(7,9,12,.6) 30%,rgba(7,9,12,0) 55%)"></div>
  <div class="abs" style="left:0;right:0;bottom:40px;text-align:center"><div class="ant" style="font-size:84px">${l1} <span style="color:#F5C518">${l2}</span></div><div class="mono" style="font-size:14px;color:#cfd3d8;margin-top:10px">${slo}</div></div><div class="grao"></div></div>`;
 document.getElementById('x').innerHTML=html;
 Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>setTimeout(()=>window.pronto=true,300));
});
</script></body></html>
