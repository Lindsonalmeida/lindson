<path d="M4 34 L70 34" stroke="#111" stroke-width="4"/></g>
<path d="M98 432 C210 418 360 448 500 424" fill="none" stroke="#111" stroke-width="9" stroke-linecap="round"/>
<path d="M150 452 C250 444 360 460 450 446" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/></g>
