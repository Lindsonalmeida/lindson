# Plataforma de marca · Barzakh · um estúdio Al Kántara
# Processo: agencia/processos/briefing-branding-identidade-visual.md (seção 2) · conta Leandro, 21/11/2026
# Fonte: v3/marca/ESTRATEGIA.md, BARZAKH-ESTADO.md, MEMORIA-DO-LINDSON.md (16 a 21/11)
marca: "Barzakh · um estúdio Al Kántara"
segmento: "Estúdio de identidade visual e branding (divisão de design do Al Kántara Group)"
cidade/praça: "São Luís - MA e interior do Maranhão; atendimento remoto"
proposito: "Fazer o negócio que já é bom parecer o que ele é: fechar a distância entre o negócio de verdade e a imagem que ele mostra."
publico:
  quem: "Dono ou dona de negócio local (clínica, loja, restaurante, escritório, profissional liberal, quem vende curso), 28 a 50 anos, que vive do boca a boca e já tem Instagram."
  dores:
    - "A marca parece amadora perto do concorrente."
    - "Cada post sai de um jeito."
    - "Tem receio de mandar o perfil para um cliente maior."
    - "Quer cobrar mais e não se sente à altura."
  desejos:
    - "Uma marca que se apresente sem pedir desculpa."
    - "Um sistema que consiga usar todo dia, sem depender de improviso."
    - "Processo claro, prazo combinado e conversa direta com o designer."
  linguagem_que_usam: ["minha marca tá amadora", "cada post sai de um jeito", "quero algo mais profissional", "tenho vergonha de mandar meu perfil", "quero parecer maior"]
concorrentes:
  - "Designer freelancer de logo avulso: entrega só o arquivo do logo, sem sistema."
  - "Canva e modelos prontos: rápido e barato, mas igual a todo mundo."
  - "Agências locais de social media: fazem post, não constroem a marca."
  - "Gráficas que 'fazem a arte': o logo vem como brinde do impresso."
posicionamento: "O dono de negócio local que já vende pelo boca a boca escolhe a Barzakh para fazer a passagem da marca improvisada para a marca que se apresenta, porque recebe um sistema completo (logo, cores, letras, voz e aplicações), apresentado aplicado antes de qualquer arquivo final, com o designer no WhatsApp."
diferencial: "Sistema de marca, não só logo; apresentado em aplicações reais; processo em etapas com prazo por escrito."
valores: ["Verdade (sem promessa de resultado)", "Método", "Acabamento", "Proximidade"]
arquetipo: "Mago (o que transforma, na versão sóbria) com apoio do Sábio (calma e método)"
personalidade: ["calma", "precisa", "profunda", "calorosa sem intimidade forçada"]
tom_de_voz:
  e: ["calmo", "preciso", "frases curtas", "concreto", "uma frase poética por peça, no máximo"]
  nao_e: ["esotérico", "místico de feira", "jargão de marketing", "promessa de resultado", "exclamação e emoji em excesso"]
tagline: "A passagem da sua marca."
palavras_chave_visuais: ["arco", "limiar", "pedra", "luz rasante", "ouro escovado"]
nome:
  significado: "Barzakh (árabe): istmo, limiar, a faixa entre duas águas que se encontram sem se misturar. Al Kántara = a ponte; Barzakh = o ponto exato da travessia."
  pronuncia: "BAR-zak"
regras:
  - "Sem foto ou rosto do Lindson na marca (20/11/2026); o nome dele só em crédito de texto."
  - "Branding da marca, não vitrine de produto (21/11/2026)."
  - "Nada de lua, estrela, mandala, caligrafia árabe, crescente ou símbolo religioso."
  - "Preços só na conversa; sem número inventado; sem promessa de resultado."
