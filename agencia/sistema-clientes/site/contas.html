<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central · Contas de acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--fundo:#09090A;--painel:#121213;--linha:#242427;--amarelo:#F5C518;--texto:#F3F0E6;--apagado:#8E8B83}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:15px/1.5 Manrope,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:32px 16px 64px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
h1{margin:0;font:800 30px/1 'Big Shoulders Display',Impact,sans-serif;letter-spacing:.02em;text-transform:uppercase}
a.bt,button{font:600 13px Manrope,sans-serif;color:var(--texto);background:none;border:1px solid var(--linha);border-radius:99px;padding:7px 14px;text-decoration:none;cursor:pointer}
a.bt:hover,button:hover{border-color:var(--amarelo)}
.sub{color:var(--apagado);margin:0 0 20px}
.card{background:var(--painel);border:1px solid var(--linha);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--linha)}
th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--apagado)}tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:rgba(245,197,24,.12);color:var(--amarelo);font-weight:700;font-size:12px}
.vazio{padding:24px;color:var(--apagado)}
</style></head><body><main>
<header><h1>Contas de acesso</h1><div style="display:flex;gap:8px"><a class="bt" href="/painel/admin">← Painel</a><a class="bt" href="/sair">Sair</a></div></header>
<p class="sub">Quem já criou conta na Central e qual painel cada um abre. Se alguém esqueceu a senha, apague a conta: a pessoa cria de novo com o mesmo código.</p>
<div class="card"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Painel</th><th>Criada em</th><th></th></tr></thead><tbody id="lista"><tr><td colspan="5" class="vazio">Carregando…</td></tr></tbody></table></div>
<script>
const NOMES={admin:'Administrador',jaci:'Dra. Jaci Cunha',leo:'Vereador Leo Pinto',sf:'Desentupidora SF',rt:'Real Time',apple:'Apple Black',curso:'Curso de processo legislativo',tribuna:'Tribuna 98'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function carrega(){const tb=document.getElementById('lista');
 try{const r=await fetch('/api/contas');const j=await r.json();if(!r.ok)throw new Error(j.erro);
  tb.innerHTML=j.contas.length?j.contas.map(c=>`<tr><td>${esc(c.nome)}</td><td>${esc(c.email)}</td><td><span class="tag">${esc(NOMES[c.cli]||c.cli)}</span></td><td>${c.criada?new Date(c.criada).toLocaleDateString('pt-BR'):''}</td><td>${c.cli==='admin'?'':`<button data-email="${esc(c.email)}">Apagar</button>`}</td></tr>`).join(''):'<tr><td colspan="5" class="vazio">Nenhuma conta ainda.</td></tr>';
  tb.querySelectorAll('[data-email]').forEach(b=>b.onclick=async()=>{if(!confirm('Apagar a conta '+b.dataset.email+'? A pessoa perde o acesso até criar a conta de novo com o código.'))return;
   const r=await fetch('/api/contas?email='+encodeURIComponent(b.dataset.email),{method:'DELETE'});if(r.ok)carrega();else alert((await r.json().catch(()=>({}))).erro||'Não deu para apagar.')});
 }catch(e){tb.innerHTML=`<tr><td colspan="5" class="vazio">${esc(e.message||'Não consegui carregar as contas.')}</td></tr>`}}
carrega();
</script></main></body></html>
