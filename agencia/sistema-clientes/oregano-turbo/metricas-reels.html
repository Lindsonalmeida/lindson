<!-- Aba Métricas por Reel (conta Leandro, 23/11/2026). Cópia do bloco injetado no privado painel/oregano.html antes de biblioteca.js; link no menu "Vendas e tráfego" (data-v="metricas"). Se o painel for remontado, reinjete este bloco. -->
<script>/* Aba "Métricas por Reel" · funil v2 aprovado pelo Lindson 23/11/2026 (conta Leandro). Dados em /api/db col "oregano-metricas-reels". */
(()=>{const V=window.__V,T=window.__T;if(!V)return;T.metricas='Métricas por Reel';
const COL='oregano-metricas-reels',X=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C=[['id','Reel'],['data','Data'],['etapa','Etapa'],['gancho_a','Gancho A'],['gancho_b','Gancho B'],['views_ig','Views'],['retencao_3s','Ret. 3s %'],['salvamentos','Salv.'],['compartilhamentos','Comp.'],['comentarios_palavra','Coment. RAIO-X'],['conversas_whatsapp','Conversas'],['vendas','Vendas'],['gancho_vencedor','Vencedor'],['decisao','Decisão']];
const NUM=['views_ig','retencao_3s','salvamentos','compartilhamentos','comentarios_palavra','conversas_whatsapp','vendas','visitas_perfil','cadastros_raiox','raiox_video','views_shorts','views_tiktok'];
const st={pronto:false,docs:{},ed:null,erro:''};
const n=v=>v===''||v==null?null:+String(v).replace(',','.');
async function car(){try{const r=await fetch('/api/db?col='+COL);if(r.ok)st.docs=(await r.json()).docs||{};else st.erro=r.status===403?'Só o administrador vê as métricas.':'Não carregou ('+r.status+').'}catch(e){st.erro='Sem conexão.'}st.pronto=true;window.__render()}
async function grava(ops){const r=await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ops:ops.map(o=>({col:COL,...o}))})});window.__toast(r.ok?'Salvo.':'Não salvou. Tente de novo.')}
const sid=s=>String(s).replace(/[^A-Za-z0-9_\-.]/g,'-').slice(0,60);
const placar=r=>(n(r.compartilhamentos)||0)+(n(r.comentarios_palavra)||0);
const dataISO=d=>{const m=String(d||'').match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?$/);return m?`${m[3]||'2026'}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:String(d||'')};
const semana=()=>{const h=new Date(),seg=new Date(h);seg.setDate(h.getDate()-((h.getDay()+6)%7)-7);const fim=new Date(seg);fim.setDate(seg.getDate()+6);return[seg.toISOString().slice(0,10),fim.toISOString().slice(0,10)]};
V.metricas=()=>{if(!st.pronto){car();return'<div class="card"><p class="sub">Carregando as métricas…</p></div>'}
 if(st.erro)return`<div class="card"><p class="sub">${X(st.erro)}</p></div>`;
 const L=Object.values(st.docs).sort((a,b)=>dataISO(a.data).localeCompare(dataISO(b.data))||String(a.id).localeCompare(b.id));
 const com=L.filter(r=>n(r.views_ig)!=null),tot=k=>L.reduce((a,r)=>a+(n(r[k])||0),0);
 const [i0,i1]=semana(),sem=com.filter(r=>{const d=dataISO(r.data);return d>=i0&&d<=i1}),base=sem.length?sem:com;
 const ord=[...base].sort((a,b)=>placar(b)-placar(a)),venc=ord[0],nPior=Math.max(1,Math.ceil(ord.length*.2)),piores=new Set(ord.length>1?ord.slice(-nPior).map(r=>r.id):[]);
 const kpi=(r,v,s)=>`<div class="card kpi"><div class="rot">${r}</div><div class="val" style="font-size:28px">${v}</div><div class="var up"><span>${s}</span></div></div>`;
 const f=v=>v==null||v===''?'<span style="color:var(--apagado)">falta</span>':X(v);
 const e=st.ed?st.docs[st.ed]||{}:{};
 return`<div class="grade g4">${kpi('Reels com dado',com.length+' de '+L.length,'linhas com views preenchidas')}${kpi('Views (IG)',tot('views_ig').toLocaleString('pt-BR'),'soma de todos')}${kpi('Comentários RAIO-X',tot('comentarios_palavra'),tot('compartilhamentos')+' compartilhamentos')}${kpi('Conversas · vendas',tot('conversas_whatsapp')+' · '+tot('vendas'),'origem no Reel (SDR)')}</div>
 <div class="card"><h3>Regra da segunda</h3><p class="sub">${sem.length?`Semana de ${i0.split('-').reverse().join('/')} a ${i1.split('-').reverse().join('/')}`:'Sem dados da semana passada: usando todos os Reels com dado'}. Placar = compartilhamentos + comentários com a palavra.</p>
 ${venc?`<p style="margin:10px 0 4px"><b style="color:var(--amarelo)">Vencedor: ${X(venc.id)}</b> · ${X(venc.gancho_a||'')} · placar ${placar(venc)} → repetir e impulsionar (R$ 15/dia).</p><p style="margin:0"><b style="color:#ff8a7a">20% piores:</b> ${[...piores].map(X).join(', ')||'—'} → se o tipo de tema ficar 2 semanas entre os piores, sai do calendário.</p>`:'<p class="sub">Preencha as views dos Reels para ver o vencedor.</p>'}</div>
 <div class="card"><h3>${st.ed?'Editar '+X(st.ed):'Lançar métricas de um Reel'}</h3><form class="fr-form" id="mt-f">${[['id','Reel (ex.: OT-31)'],['data','Data (dd/mm)'],['tema','Tema'],['etapa','Etapa'],['gancho_a','Gancho A'],['gancho_b','Gancho B'],...NUM.map(k=>[k,{views_ig:'Views Instagram',retencao_3s:'Retenção 3 s (%)',salvamentos:'Salvamentos',compartilhamentos:'Compartilhamentos',comentarios_palavra:'Comentários com RAIO-X',conversas_whatsapp:'Conversas no WhatsApp',vendas:'Vendas',visitas_perfil:'Visitas ao perfil',cadastros_raiox:'Cadastros no Raio-X',raiox_video:'Raio-X em vídeo pedidos',views_shorts:'Views Shorts',views_tiktok:'Views TikTok'}[k]]),['gancho_vencedor','Gancho vencedor (A/B)'],['decisao','Decisão (repetir/cortar/testar)']].map(([k,r])=>`<label>${X(r)}<input name="${k}" ${NUM.includes(k)?'inputmode="decimal"':''} value="${X(e[k]??'')}" ${k==='id'?'required':''}></label>`).join('')}</form>
 <div class="fr-acoes"><button class="btn am" type="submit" form="mt-f">Salvar</button>${st.ed?'<button class="btn lin" type="button" id="mt-c">Cancelar</button>':''}<label class="btn lin" style="cursor:pointer">Importar metricas-reels.csv<input type="file" accept=".csv" id="mt-csv" hidden></label><button class="btn lin" type="button" id="mt-b">Baixar planilha</button></div></div>
 <div class="card"><h3>Reels</h3><div class="tab"><table><thead><tr>${C.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>${L.map(r=>`<tr style="${venc&&r.id===venc.id?'background:rgba(242,179,61,.14)':piores.has(r.id)?'background:rgba(200,48,43,.16)':''}">${C.map(([k])=>`<td>${NUM.includes(k)?f(r[k]):X(r[k]||'')}</td>`).join('')}<td style="white-space:nowrap"><button class="btn lin" type="button" data-mte="${X(r.id)}" style="padding:5px 9px;font-size:12px">Editar</button> <button class="btn lin" type="button" data-mtd="${X(r.id)}" style="padding:5px 9px;font-size:12px" aria-label="Excluir">✕</button></td></tr>`).join('')||`<tr><td colspan="${C.length+1}">Nenhum Reel. Importe o metricas-reels.csv.</td></tr>`}</tbody></table></div><p class="sub" style="margin-top:8px">Dourado: vencedor da semana · vermelho: 20% piores. Sem dado = "falta" (nunca estimado).</p></div>`};
function csvLe(t){const L=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==','||ch==';'){row.push(c);c=''}else if(ch=='\n'){row.push(c.replace(/\r$/,''));L.push(row);row=[];c=''}else c+=ch}if(c||row.length){row.push(c);L.push(row)}return L.filter(r=>r.some(x=>x.trim()))}
const ant=window.__pos;window.__pos=v=>{if(ant)ant(v);if(v!=='metricas')return;const m=document.getElementById('conteudo');if(!m)return;
 const fm=m.querySelector('#mt-f');if(fm)fm.onsubmit=async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(fm));d.id=String(d.id).trim();if(!d.id)return;const id=sid(d.id);if(st.ed&&st.ed!==id){delete st.docs[st.ed];await grava([{op:'delete',id:st.ed}])}st.docs[id]=d;st.ed=null;await grava([{op:'set',id,data:d}]);window.__render()};
 const cc=m.querySelector('#mt-c');if(cc)cc.onclick=()=>{st.ed=null;window.__render()};
 m.querySelectorAll('[data-mte]').forEach(b=>b.onclick=()=>{st.ed=b.dataset.mte;window.__render();scrollTo({top:0,behavior:'smooth'})});
 m.querySelectorAll('[data-mtd]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir '+b.dataset.mtd+'?'))return;delete st.docs[b.dataset.mtd];await grava([{op:'delete',id:b.dataset.mtd}]);window.__render()});
 const fi=m.querySelector('#mt-csv');if(fi)fi.onchange=async()=>{const L=csvLe((await fi.files[0].text()).replace(/^﻿/,''));const h=L.shift().map(x=>x.trim());const ops=[];
  for(const r of L){const o={};h.forEach((k,i)=>{if(r[i]!=null&&r[i]!=='')o[k]=r[i].trim()});if(!o.id)continue;const id=sid(o.id),at=st.docs[id]||{};for(const k in o)if(at[k]==null||at[k]==='')at[k]=o[k];st.docs[id]=at;ops.push({op:'set',id,data:at})}
  if(!ops.length)return window.__toast('Nada para importar.');for(let i=0;i<ops.length;i+=50)await grava(ops.slice(i,i+50));window.__toast(ops.length+' Reels importados (sem apagar o que já foi preenchido).');window.__render()};
 const bb=m.querySelector('#mt-b');if(bb)bb.onclick=()=>{const ks=['id','data','tema','etapa','gancho_a','gancho_b',...NUM,'gancho_vencedor','decisao'];const csv='﻿'+[ks.join(';'),...Object.values(st.docs).map(r=>ks.map(k=>`"${String(r[k]??'').replace(/"/g,'""')}"`).join(';'))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='metricas-reels-oregano.csv';a.click()}};
if(location.hash==='#metricas')setTimeout(()=>window.__render(),0)})();</script>
