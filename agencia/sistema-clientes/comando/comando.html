<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<title>Central de Comando</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Central de Comando do Lindson (conta Leandro, 09/11/2026). Fonte: agencia/sistema-clientes/comando/ (repositório lindson).
   Sistema no visual do modelo da Central: menu lateral, cartões de números, telas e animações do movimento.js.
   Referências: Linear (grade fina e rótulos mono), Teenage Engineering OP-1 (teclas grandes de hardware) e rabbit r1 (um botão físico para falar). */
:root{
  --fundo:#0B0B0B;--painel:#121212;--painel2:#181818;--linha:#232323;--linha2:#2E2E2E;--amarelo:#F5C518;--amarelo2:#FFD84A;
  --texto:#F4F1E8;--apagado:#8D8A82;--ok:#5CC98A;--alerta:#F2A93B;--erro:#E5604D;--azul:#7FB2FF;
  --f-titulo:'Anton','Arial Narrow',Impact,sans-serif;--f-corpo:'Manrope',system-ui,sans-serif;--f-dado:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font:500 14px/1.5 var(--f-corpo);overflow-x:clip;-webkit-tap-highlight-color:transparent}
/* grade fina + brilho sutil */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(var(--linha) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,var(--linha) 1px,transparent 1px) 0 0/56px 56px;
  opacity:.38;-webkit-mask:radial-gradient(ellipse 90% 70% at 60% 0%,#000 30%,transparent 80%);mask:radial-gradient(ellipse 90% 70% at 60% 0%,#000 30%,transparent 80%)}
body::after{content:"";position:fixed;left:50%;top:-320px;width:900px;height:620px;transform:translateX(-30%);pointer-events:none;z-index:0;
  background:radial-gradient(closest-side,rgba(245,197,24,.13),transparent);filter:blur(10px)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.mono{font-family:var(--f-dado)}
.rot{font:500 10.5px var(--f-dado);letter-spacing:.2em;text-transform:uppercase;color:var(--apagado)}
/* menu lateral */
.menu{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 16px;border-right:1px solid var(--linha);background:rgba(10,10,10,.86);backdrop-filter:blur(8px);overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--texto)}
.logo b{width:36px;height:36px;display:grid;place-items:center;border:1.5px solid var(--amarelo);color:var(--amarelo);font:400 16px var(--f-titulo);letter-spacing:.04em}
.logo span{font:400 19px/1 var(--f-titulo);letter-spacing:.05em;text-transform:uppercase}
.logo small{display:block;font:500 9.5px var(--f-dado);letter-spacing:.22em;color:var(--apagado);margin-top:4px}
.vivo{display:inline-flex;align-items:center;gap:8px;font:500 10.5px var(--f-dado);letter-spacing:.16em;text-transform:uppercase;color:var(--texto)}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--erro);box-shadow:0 0 0 0 rgba(229,96,77,.6);animation:rec 1.6s infinite}
@keyframes rec{70%{box-shadow:0 0 0 8px rgba(229,96,77,0)}100%{box-shadow:0 0 0 0 rgba(229,96,77,0)}}
.grupo{display:grid;gap:2px}
.grupo h4{margin:6px 8px 4px;font:500 10px var(--f-dado);letter-spacing:.24em;text-transform:uppercase;color:var(--apagado)}
.grupo a{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#C9C5BA;text-decoration:none;font-weight:600}
.grupo a svg{width:18px;height:18px;flex:none}
.grupo a:hover{background:var(--painel2);color:var(--texto)}
.grupo a[aria-current="page"]{background:rgba(245,197,24,.12);color:var(--amarelo)}
.grupo a .n{margin-left:auto;font:700 11px var(--f-dado);background:var(--amarelo);color:#0A0A0A;border-radius:99px;padding:0 7px}
.grupo a .n:empty{display:none}
.contas-menu{margin-top:auto;border:1px solid var(--linha);border-radius:14px;padding:14px;display:grid;gap:9px;background:var(--painel)}
.contas-menu .c{display:flex;align-items:center;gap:8px;font-size:12.5px}
.contas-menu .c i{width:7px;height:7px;border-radius:50%;background:var(--linha2);flex:none}
.contas-menu .c i.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.contas-menu .c em{margin-left:auto;font:500 10.5px var(--f-dado);color:var(--apagado);font-style:normal}
/* topo */
.area{min-width:0;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px max(20px,env(safe-area-inset-right,0px)) 14px 26px;border-bottom:1px solid var(--linha);background:rgba(11,11,11,.88);backdrop-filter:blur(10px)}
.topo h1{margin:0;font:400 28px/1 var(--f-titulo);letter-spacing:.03em;text-transform:uppercase}
.topo .dir{margin-left:auto;display:flex;align-items:center;gap:12px}
.relogio{font:500 11px var(--f-dado);letter-spacing:.12em;color:var(--apagado)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--amarelo);color:#0A0A0A;display:grid;place-items:center;font:400 14px var(--f-titulo);text-decoration:none}
main{padding:24px max(20px,env(safe-area-inset-right,0px)) 56px 26px;display:grid;gap:18px;align-content:start}
/* base dos cartões (mesmas classes do modelo, para o movimento.js) */
.grade{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 40%),var(--painel);border:1px solid var(--linha);border-radius:18px;padding:18px;min-width:0}
.card h3{margin:0 0 4px;font:700 15px var(--f-corpo)}
.card .sub{margin:0 0 14px;color:var(--apagado);font-size:12.5px}
.card .cab{display:flex;align-items:baseline;gap:10px;justify-content:space-between;margin-bottom:12px}
.kpi .rot{display:block}
.kpi .val{font:400 40px/1.05 var(--f-titulo);letter-spacing:.02em;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.kpi .val.am{color:var(--amarelo)}
.kpi .dica{color:var(--apagado);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:10px 15px;font:700 13.5px var(--f-corpo);cursor:pointer;text-decoration:none;color:var(--texto);min-height:42px}
.btn svg{width:17px;height:17px}
.btn.am{background:var(--amarelo);color:#0A0A0A}.btn.am:hover{background:var(--amarelo2)}
.btn.lin{background:transparent;border:1px solid var(--linha2)}.btn.lin:hover{border-color:var(--amarelo);color:var(--amarelo)}
.btn.ok{background:var(--ok);color:#06140c}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn:focus-visible,.grupo a:focus-visible,.chipc:focus-visible,.fn:focus-visible,.mic:focus-visible,.tab:focus-visible{outline:2px solid var(--amarelo);outline-offset:3px}
.barra{height:8px;border-radius:99px;background:var(--painel2);overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px;background:var(--amarelo)}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--f-dado);letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:3px 9px;white-space:nowrap;border:1px solid currentColor}
.chip.novo{color:var(--azul)}.chip.andamento{color:var(--alerta)}.chip.pronto{color:var(--amarelo)}.chip.aprovado{color:var(--ok)}.chip.ajuste{color:var(--erro)}
.vazio{border:1px dashed var(--linha2);border-radius:14px;padding:18px;color:var(--apagado);text-align:center;font-size:13px}
/* tela Comando */
.passo{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.passo b{font:700 11px var(--f-dado);color:#0A0A0A;background:var(--amarelo);border-radius:6px;padding:2px 6px}
.passo span{font:500 10.5px var(--f-dado);letter-spacing:.2em;text-transform:uppercase;color:var(--apagado)}
.palco{display:grid;grid-template-columns:minmax(260px,.9fr) minmax(0,1.1fr);gap:16px;align-items:stretch}
.voz{display:grid;place-items:center;text-align:center;gap:14px;padding:26px 18px 22px;overflow:hidden}
.voz .hud{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between}
.mic{position:relative;width:min(188px,52vw);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;margin-top:18px;
  background:radial-gradient(circle at 35% 30%,#FFE272,var(--amarelo) 45%,#C99A00);color:#0A0A0A;display:grid;place-items:center;
  box-shadow:0 0 0 10px rgba(245,197,24,.08),0 0 0 22px rgba(245,197,24,.04),0 30px 60px -20px rgba(245,197,24,.45),inset 0 -8px 18px rgba(0,0,0,.18);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.mic:active{transform:scale(.95)}
.mic svg{width:34%;height:34%}
.mic::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px solid rgba(245,197,24,.35);opacity:0}
.mic.ouvindo{background:radial-gradient(circle at 35% 30%,#FF8A7A,var(--erro) 50%,#A8321F);color:#fff;box-shadow:0 0 0 10px rgba(229,96,77,.12),0 0 0 22px rgba(229,96,77,.06),0 30px 60px -20px rgba(229,96,77,.6)}
.mic.ouvindo::after{border-color:rgba(229,96,77,.5);animation:onda 1.4s infinite}
@keyframes onda{from{transform:scale(.9);opacity:.9}to{transform:scale(1.35);opacity:0}}
.ondas{display:flex;gap:4px;height:26px;align-items:center}
.ondas i{width:4px;height:6px;border-radius:4px;background:var(--linha2);transition:height .2s}
.ouvindo-on .ondas i{background:var(--amarelo);animation:barras 0.9s ease-in-out infinite}
.ondas i:nth-child(2n){animation-delay:.15s!important}.ondas i:nth-child(3n){animation-delay:.3s!important}.ondas i:nth-child(5n){animation-delay:.45s!important}
@keyframes barras{50%{height:24px}}
.fala{min-height:44px;max-width:420px;font:600 16px/1.4 var(--f-corpo)}
.fala.vazia{color:var(--apagado);font-weight:500;font-size:14px}
.escrever{display:flex;gap:8px;width:100%;max-width:440px}
.escrever input{flex:1;min-width:0;background:var(--painel2);border:1px solid var(--linha2);border-radius:11px;color:var(--texto);padding:11px 13px;font:500 14px var(--f-corpo)}
.escrever input:focus{outline:none;border-color:var(--amarelo)}
.console{display:flex;flex-direction:column;gap:12px}
.linhas{display:grid;gap:0;border:1px solid var(--linha);border-radius:14px;overflow:hidden;background:#0E0E0E}
.linhas div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--linha)}
.linhas div:last-child{border-bottom:0}
.linhas span{font:500 10.5px var(--f-dado);letter-spacing:.2em;text-transform:uppercase;color:var(--apagado)}
.linhas b{font:700 15px var(--f-corpo);min-width:0;overflow-wrap:anywhere}
.linhas b.falta{color:#5b5952;font-weight:600}
.detalhe{width:100%;min-height:70px;resize:vertical;background:var(--painel2);border:1px solid var(--linha2);border-radius:12px;color:var(--texto);padding:12px 13px;font:500 14px/1.45 var(--f-corpo)}
.detalhe:focus{outline:none;border-color:var(--amarelo)}
.enviar{width:100%;min-height:58px;font-size:16px;border-radius:14px;letter-spacing:.01em}
.aviso{border:1px solid rgba(242,169,59,.45);background:rgba(242,169,59,.07);border-radius:14px;padding:14px;display:grid;gap:10px}
.aviso h4{margin:0;font:700 14px var(--f-corpo);color:var(--alerta);display:flex;gap:8px;align-items:center}
.aviso p{margin:0;font-size:13px;color:#D8D2C2}
.aviso .acoes{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chipc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:10px 16px 10px 14px;border-radius:14px;border:1px solid var(--linha2);background:var(--painel2);color:var(--texto);cursor:pointer;font:700 14.5px var(--f-corpo);text-align:left;transition:border-color .2s,background-color .2s,transform .15s}
.chipc small{font:500 9.5px var(--f-dado);letter-spacing:.16em;text-transform:uppercase;color:var(--apagado)}
.chipc small.pg{color:var(--amarelo)}
.chipc:hover{border-color:#4a4a4a}
.chipc:active{transform:scale(.97)}
.chipc[aria-pressed="true"]{border-color:var(--amarelo);background:rgba(245,197,24,.12);box-shadow:inset 0 0 0 1px var(--amarelo)}
.funcoes{display:grid;gap:18px}
.fgrupo h5{margin:0 0 10px;font:500 10px var(--f-dado);letter-spacing:.24em;text-transform:uppercase;color:var(--apagado)}
.fgrade{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.fn{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:104px;padding:13px;border-radius:16px;border:1px solid var(--linha2);
  background:linear-gradient(180deg,#1C1C1C,#141414);color:var(--texto);cursor:pointer;text-align:left;font:700 14px/1.2 var(--f-corpo);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 2px 0 #050505;transition:transform .15s,border-color .2s,background-color .2s}
.fn:hover{border-color:#4a4a4a;transform:translateY(-2px)}
.fn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.fn svg{width:24px;height:24px;color:var(--amarelo)}
.fn em{position:absolute;right:11px;top:11px;font:500 9.5px var(--f-dado);font-style:normal;letter-spacing:.12em;color:#5b5952}
.fn[aria-pressed="true"]{background:var(--amarelo);color:#0A0A0A;border-color:var(--amarelo)}
.fn[aria-pressed="true"] svg,.fn[aria-pressed="true"] em{color:#0A0A0A}
.fn.acao em{color:var(--azul)}
/* fila */
.filtros{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--linha2);background:var(--painel2);color:#C9C5BA;border-radius:99px;padding:9px 14px;font:600 13px var(--f-corpo);cursor:pointer;min-height:40px}
.tab[aria-pressed="true"]{background:var(--amarelo);border-color:var(--amarelo);color:#0A0A0A}
.tab span{font:700 11px var(--f-dado);margin-left:6px;opacity:.75}
.pedidos{display:grid;gap:12px}
.ped{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.ped .topo-p{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.ped .id{font:500 10.5px var(--f-dado);color:var(--apagado);letter-spacing:.1em}
.ped h3{font-size:16px}
.ped .txt{margin:4px 0 8px;color:#D8D2C2;font-size:13.5px;overflow-wrap:anywhere}
.ped .meta{display:flex;flex-wrap:wrap;gap:14px;font:500 11px var(--f-dado);color:var(--apagado)}
.ped .nota{margin-top:10px;border-left:2px solid var(--erro);padding:4px 10px;font-size:13px;color:#E8C9C2}
.ped .acoes{display:flex;flex-direction:column;gap:8px;min-width:150px}
/* resultados */
.proj{display:grid;gap:14px}
.proj .l{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:6px 12px;align-items:center}
.proj .l b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .l b small{color:var(--amarelo);font:500 9.5px var(--f-dado);letter-spacing:.14em;margin-left:6px}
.proj .l span{font:700 12px var(--f-dado);text-align:right}
.proj .l .barra{grid-column:1/-1}
.lista{display:grid}
.lista .it{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--linha)}
.lista .it:last-child{border-bottom:0}
.lista .it .q{font:600 10.5px var(--f-dado);letter-spacing:.06em;color:var(--amarelo);white-space:nowrap}
.lista .it .o{font-size:13px;overflow-wrap:anywhere}
.lista .it .o small{display:block;color:var(--apagado);font-size:11.5px;margin-top:2px}
.conta-bloco{border:1px solid var(--linha);border-radius:14px;padding:14px;background:#0F0F0F}
.conta-bloco h4{margin:0 0 8px;display:flex;align-items:center;gap:8px;font:700 14px var(--f-corpo)}
.conta-bloco h4 em{margin-left:auto;font:500 10.5px var(--f-dado);color:var(--apagado);font-style:normal}
.conta-bloco ul{margin:0;padding-left:16px;display:grid;gap:6px;font-size:12.5px;color:#D8D2C2}
.aprov{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.aprov a{display:grid;gap:4px;padding:14px;border-radius:14px;border:1px solid var(--linha2);background:#0F0F0F;text-decoration:none;color:var(--texto)}
.aprov a b{font:400 30px/1 var(--f-titulo)}
.aprov a b.am{color:var(--amarelo)}
.aprov a span{font-size:12.5px;font-weight:700}
.aprov a small{color:var(--apagado);font-size:11.5px}
.aprov a:hover{border-color:var(--amarelo)}
.esperando li{margin-bottom:4px}
/* janela (ajuste) e aviso */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);display:grid;place-items:end center;padding:16px}
.caixa{width:min(520px,100%);background:var(--painel);border:1px solid var(--linha2);border-radius:20px;padding:20px;display:grid;gap:12px;margin-bottom:max(0px,env(safe-area-inset-bottom))}
.caixa h3{margin:0;font:400 24px var(--f-titulo);letter-spacing:.03em;text-transform:uppercase}
@media (min-width:700px){.modal{place-items:center}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:#F4F1E8;color:#0A0A0A;padding:12px 16px;border-radius:12px;font:700 13.5px var(--f-corpo);box-shadow:0 20px 40px -12px #000;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
/* barra de baixo (celular) */
.abas-cel{display:none}
#envio-cel{display:none}
@media (max-width:1180px){.fgrade{grid-template-columns:repeat(4,minmax(0,1fr))}.aprov{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .menu{display:none}
  .topo{padding:12px 16px}
  .topo h1{font-size:23px}
  main{padding:16px 16px calc(104px + env(safe-area-inset-bottom))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2,.g21,.palco{grid-template-columns:1fr}
  .abas-cel{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;
    background:rgba(20,20,20,.92);backdrop-filter:blur(14px);border:1px solid var(--linha2);border-radius:20px;padding:6px;box-shadow:0 20px 40px -10px #000}
  .abas-cel a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:14px;color:#C9C5BA;text-decoration:none;font:700 11.5px var(--f-corpo)}
  .abas-cel a svg{width:22px;height:22px}
  .abas-cel a[aria-current="page"]{background:var(--amarelo);color:#0A0A0A}
  .abas-cel a .n{position:absolute;top:4px;right:calc(50% - 26px);font:700 10px var(--f-dado);background:var(--erro);color:#fff;border-radius:99px;padding:0 5px}
  .abas-cel a .n:empty{display:none}
  #envio-cel.on{display:flex;position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:19;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:16px;background:#1A1A1A;border:1px solid var(--amarelo);box-shadow:0 18px 40px -12px #000}
  #envio-cel span{flex:1;min-width:0;font:700 13px var(--f-corpo);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #envio-cel small{display:block;font:500 9.5px var(--f-dado);letter-spacing:.16em;color:var(--apagado)}
  #envio-cel .btn{min-height:46px}
  body.com-envio main{padding-bottom:calc(170px + env(safe-area-inset-bottom))}

<script>
/* ===== Central de Comando · lógica (conta Leandro, 09/11/2026) =====
   Fila: /api/dados?cli=admin&f=ped → {dados:{itens:[{id,cli,func,texto,st,conta,link,criado,atualizado,nota,prontoEm,ajustes}]},versao}

(() => {
const E = window.__ESTADO || { placar: [], entregas: [], andamento: [], agenda: null, gerado: '' };

const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];

const sem = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const ic = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {

  estrategia: ic('<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h4"/>'),
  proposta: ic('<path d="M4 7h16v12H4z"/><path d="m4 7 8 6 8-6"/>'),

  relatorio: ic('<path d="M4 20V10M9.3 20V5M14.6 20v-7M20 20v-4"/>'),

  aprovar: ic('<circle cx="12" cy="12" r="8.5"/><path d="m8 12.2 2.7 2.7L16.2 9"/>'),
  fotos: ic('<path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/>'),
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  pare: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
  enviar: ic('<path d="M4 12 20 4l-6 16-3-7z"/><path d="m11 13 9-9"/>'),
  alerta: ic('<path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5M12 17.5h.01"/>')
};
// clientes (pagantes primeiro). painel: endereço na Central; null = sem painel próprio
const CLIS = [
  { id: 'jaci', nome: 'Dra. Jaci', pg: 1, painel: 'jaci', voz: ['jaci', 'clinica', 'dra jaci', 'doutora'] },
  { id: 'tribuna', nome: 'Tribuna 98', pg: 1, painel: 'tribuna', voz: ['tribuna'] },
  { id: 'leo', nome: 'Leo Pinto', pg: 1, painel: 'leo', voz: ['leo', 'vereador', 'leonardo'] },
  { id: 'rt', nome: 'Real Time', pg: 1, painel: 'rt', voz: ['real time', 'realtime', 'real taime', 'rial time'] },
  { id: 'oregano', nome: 'Orégano Turbo', pg: 0, painel: 'oregano', voz: ['oregano', 'pizzaria'] },
  { id: 'marca', nome: 'Minha marca', pg: 0, painel: null, voz: ['minha marca', 'meu instagram', 'meu perfil', 'lindson', 'minha pagina'] },
  { id: 'outro', nome: 'Outro', pg: 0, painel: null, voz: ['outro cliente', 'cliente novo', 'lead'] }
];
// funções: tipo 'pedido' vai para a fila; 'acao' faz na hora
const GRUPOS = [
  ['Conteúdo', [['reels', 'Reels', ['reels', 'reel', 'video curto', 'rios']], ['carrossel', 'Carrossel', ['carrossel', 'carrocel', 'carosel']], ['post', 'Post', ['post', 'poste', 'arte do feed']], ['stories', 'Stories', ['stories', 'story', 'storys', 'estoris']], ['legenda', 'Legenda SEO', ['legenda']], ['data', 'Arte de data', ['arte de data', 'data comemorativa', 'feriado', 'dia de', 'dia do', 'dia da']]]],
  ['Sites e sistemas', [['site', 'Site / mini site', ['mini site', 'site', 'bio']], ['landing', 'Landing', ['landing', 'pagina de venda', 'pagina de captura']], ['painel', 'Painel do cliente', ['painel do cliente', 'criar painel', 'montar painel']]]],
  ['Documentos', [['estrategia', 'Estratégia PDF', ['estrategia']], ['proposta', 'Proposta', ['proposta', 'orcamento']], ['contrato', 'Contrato', ['contrato']], ['relatorio', 'Relatório do cliente', ['relatorio']]]],
  ['Acompanhar', [['status', 'Status do projeto', ['status', 'como esta', 'placar'], 1], ['aprovar', 'Ver aprovações', ['aprovar', 'aprovacao', 'aprovacoes'], 1], ['fotos', 'Fotos do cliente', ['fotos', 'foto'], 1]]]
];
const FN = {}; let k = 0; GRUPOS.forEach(g => g[1].forEach(f => { k++; FN[f[0]] = { id: f[0], nome: f[1], voz: f[2], acao: !!f[3], cod: 'F' + String(k).padStart(2, '0') }; }));
const CONTAS = ['Lindson', 'Zuleide', 'Pedro', 'Leandro'];
const ST = { novo: 'Novo', andamento: 'Com a conta', pronto: 'Pronto', aprovado: 'Aprovado', ajuste: 'Ajuste' };
const ABERTOS = ['novo', 'andamento', 'pronto', 'ajuste'];
const nomeCli = id => (CLIS.find(c => c.id === id) || { nome: id || '—' }).nome;
const nomeFn = id => (FN[id] || { nome: id || '—' }).nome;

// ---------- fila no servidor (com versão; em 409 junta e tenta de novo) ----------
const URL_PED = API + '/api/dados?cli=admin&f=ped';
let FILA = { itens: [] }, VERSAO = 0, CARREGOU = false, ERRO = '';
async function carrega() {
  try { const r = await fetch(URL_PED, { credentials: 'same-origin', cache: 'no-store' });
    if (r.status === 401) { location.href = '/'; return; }
    const j = await r.json(); if (!r.ok) throw new Error(j.erro || 'erro');
    FILA = (j.dados && Array.isArray(j.dados.itens)) ? j.dados : { itens: [] }; VERSAO = j.versao || 0; CARREGOU = true; ERRO = '';
  } catch (e) { ERRO = 'Não consegui ler a fila agora. Confira a internet e toque em atualizar.'; }
}
async function muda(fn) {
  for (let i = 0; i < 4; i++) {
    const d = JSON.parse(JSON.stringify(FILA || { itens: [] })); d.itens = d.itens || []; fn(d);
    try {
      const r = await fetch(URL_PED, { method: 'PUT', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dados: d, versao: VERSAO }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { FILA = d; VERSAO = j.versao; return true; }
      if (r.status === 409) { FILA = (j.dados && j.dados.itens) ? j.dados : { itens: [] }; VERSAO = j.versao || 0; continue; } // outra conta salvou: aplica de novo sobre a versão nova
      toast(j.erro || 'Não consegui salvar.'); return false;
    } catch (e) { toast('Sem conexão. Tente de novo.'); return false; }
  }
  toast('A fila mudou várias vezes seguidas. Tente de novo.'); return false;
}
const agora = () => new Date().toISOString();
const novoId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const dt = iso => { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
const horas = ms => ms < 36e5 ? Math.max(1, Math.round(ms / 6e4)) + ' min' : ms < 864e5 ? (ms / 36e5).toFixed(1).replace('.', ',') + ' h' : (ms / 864e5).toFixed(1).replace('.', ',') + ' dias';

// ---------- estado da tela Comando ----------
const P = { cli: null, fn: null, texto: '', forcar: false };
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3200); }

// ---------- voz ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, ouvindo = false;
function entende(frase, final) {
  const s = ' ' + sem(frase).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ') + ' ';
  // navegação
  if (final && /\b(abrir|abre|ir para|vai para|mostrar)\b.*\bpainel\b/.test(s)) {
    const c = CLIS.find(c => c.voz.some(v => s.includes(' ' + v + ' ') || s.includes(' ' + v)));
    if (c && c.painel) { toast('Abrindo o painel de ' + c.nome + '…'); setTimeout(() => location.href = '/painel/' + c.painel, 500); return 'nav'; }
    if (/\badmin\b/.test(s)) { location.href = '/painel/admin'; return 'nav'; }
  }
  if (final && /\b(ver|abrir|abre|mostrar)?\s*(a )?fila\b/.test(s) && !/\b(reels|post|carrossel|site)\b/.test(s)) { location.hash = '#fila'; return 'nav'; }
  if (final && /\b(status|resultado|resultados|analise|analises|placar|relatorio geral)\b/.test(s) && !/\brelatorio do\b/.test(s) && !/\b(reels|post|carrossel|stories|site|landing|contrato|proposta)\b/.test(s) && !P.cli) { location.hash = '#resultados'; return 'nav'; }
  // cliente e função
  const c = CLIS.find(c => c.voz.some(v => s.includes(' ' + v + ' ')));
  if (c) P.cli = c.id;
  let melhor = null, tam = 0;
  Object.values(FN).forEach(f => f.voz.forEach(v => { if (s.includes(' ' + v + ' ') || s.includes(' ' + v + 's ')) { if (v.length > tam) { melhor = f; tam = v.length; } } }));
  if (melhor) P.fn = melhor.id;
  return /\b(enviar|envia|manda|mandar)\s*$/.test(s.trim()) ? 'enviar' : 'ok';
}
function limpaFala(t) { return t.replace(/[,.\s]*(enviar|envia|manda|mandar)[.!]?\s*$/i, '').trim(); }
function ouvir() {
  if (!SR) { toast('Este navegador não tem voz. Escreva no campo abaixo do botão.'); $('#escrever input') && $('#escrever input').focus(); return; }
  if (ouvindo && rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let final = '';
  rec.onstart = () => { ouvindo = true; marcaMic(); falaTxt('Ouvindo… fale o cliente, o que precisa e o detalhe.', true); };
  rec.onresult = e => { let parcial = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) final += t + ' '; else parcial += t; }
    falaTxt((final + parcial).trim()); entende(final + parcial, false); pintaEscolhas(); };
  rec.onerror = e => { ouvindo = false; marcaMic(); falaTxt(e.error === 'not-allowed' ? 'O microfone foi bloqueado. Libere o microfone para este site nas configurações do navegador, ou escreva abaixo.' : 'Não entendi. Toque e fale de novo, ou escreva abaixo.', true); };
  rec.onend = () => { ouvindo = false; marcaMic(); if (final.trim()) processa(final.trim()); };
  try { rec.start(); } catch (e) { toast('Não consegui ligar o microfone.'); }
}
function processa(frase) {
  const r = entende(frase, true); if (r === 'nav') return;
  const limpo = limpaFala(frase); P.texto = limpo; const ta = $('#detalhe'); if (ta) ta.value = limpo;
  falaTxt(limpo); pintaEscolhas();
  if (P.fn && FN[P.fn].acao) { executaAcao(P.fn); return; }
  if (r === 'enviar') envia();
}
function marcaMic() { const m = $('#mic'); if (!m) return; m.classList.toggle('ouvindo', ouvindo); m.innerHTML = ouvindo ? I.pare : I.mic; m.setAttribute('aria-label', ouvindo ? 'Parar de ouvir' : 'Falar um pedido'); $('#voz').classList.toggle('ouvindo-on', ouvindo); $('#mic-rot').textContent = ouvindo ? '● GRAVANDO' : (SR ? 'TOQUE PARA FALAR' : 'VOZ INDISPONÍVEL · ESCREVA'); }
function falaTxt(t, vazia) { const f = $('#fala'); if (!f) return; f.textContent = t; f.classList.toggle('vazia', !!vazia); }

// ---------- ações que não vão para a fila ----------
function executaAcao(id) {
  const c = CLIS.find(x => x.id === P.cli);
  if (id === 'status') { location.hash = '#resultados'; return; }
  if (id === 'aprovar') { if (c && c.painel) location.href = '/painel/' + c.painel + '#aprovacoes'; else { location.hash = '#resultados'; setTimeout(() => { const a = $('#bloco-aprov'); a && a.scrollIntoView({ behavior: 'smooth' }); }, 400); } return; }
  if (id === 'fotos') { if (c && c.painel) location.href = '/painel/' + c.painel + '#fotos'; else toast('Escolha antes um cliente com painel (Jaci, Tribuna, Leo, Real Time ou Orégano).'); }
}

// ---------- "já existe": mesmo cliente e mesma função, aberto ou pronto, nos últimos 14 dias ----------
function jaExiste(cli, fn) {
  const lim = Date.now() - 14 * 864e5;
  return (FILA.itens || []).filter(x => x.cli === cli && x.func === fn && ABERTOS.includes(x.st) && Date.parse(x.criado || 0) >= lim)
    .sort((a, b) => (b.criado || '').localeCompare(a.criado || ''));
}
// também procura no registro das contas (entregas dos últimos 14 dias com o nome do cliente e da função)
function noRegistro(cli, fn) {
  if (!cli || !fn || cli === 'outro') return [];
  const c = CLIS.find(x => x.id === cli), f = FN[fn], lim = Date.now() - 14 * 864e5;
  const nomes = cli === 'marca' ? ['lindson', 'minha marca', 'marca pessoal'] : c.voz.concat(sem(c.nome));
  return (E.entregas || []).filter(e => { const t = sem(e.oque + ' ' + e.onde), d = Date.parse(e.iso || 0);
    return d >= lim && nomes.some(n => t.includes(n)) && f.voz.some(v => t.includes(v)); }).slice(0, 2);
}
async function envia() {
  if (!P.cli || !P.fn) { toast(!P.cli ? 'Toque no cliente primeiro.' : 'Toque no que você precisa.'); return; }
  if (FN[P.fn].acao) { executaAcao(P.fn); return; }
  if (!CARREGOU) { toast('A fila ainda não carregou. Toque em atualizar.'); return; }
  const dup = jaExiste(P.cli, P.fn);
  if (dup.length && !P.forcar) { pintaAviso(dup); toast('Já existe um pedido igual. Veja antes de mandar outro.'); return; }
  const texto = ($('#detalhe') ? $('#detalhe').value : P.texto).trim().slice(0, 500);
  const item = { id: novoId(), cli: P.cli, func: P.fn, texto, st: 'novo', conta: '', link: '', criado: agora(), atualizado: agora(), nota: '', ajustes: 0 };
  const b = $('#btn-enviar'); if (b) b.disabled = true;
  const ok = await muda(d => { d.itens.unshift(item); });
  if (b) b.disabled = false;
  if (ok) { toast('Enviado para a equipe: ' + nomeFn(item.func) + ' · ' + nomeCli(item.cli) + '.'); P.fn = null; P.texto = ''; P.forcar = false; if ($('#detalhe')) $('#detalhe').value = ''; falaTxt('Pedido na fila. A primeira conta livre pega.', true); pintaEscolhas(); contadores(); }
}

// ---------- telas ----------
const kpi = (rot, val, dica, am) => `<div class="card kpi"><span class="rot">${rot}</span><div class="val${am ? ' am' : ''}">${val}</div><div class="dica">${dica}</div></div>`;
function numeros() {
  const it = FILA.itens || [], sem7 = Date.now() - 7 * 864e5;
  return { novo: it.filter(x => x.st === 'novo' || x.st === 'ajuste').length, andamento: it.filter(x => x.st === 'andamento').length, pronto: it.filter(x => x.st === 'pronto').length,
    aprov7: it.filter(x => x.st === 'aprovado' && Date.parse(x.atualizado || 0) >= sem7).length };
}
function telaComando() {

// ---------- cliques ----------
document.addEventListener('click', async e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.id === 'mic') { ouvir(); return; }
  if (t.dataset.cli) { P.cli = P.cli === t.dataset.cli ? null : t.dataset.cli; P.forcar = false; pintaEscolhas(); return; }
  if (t.dataset.fn) { P.fn = P.fn === t.dataset.fn ? null : t.dataset.fn; P.forcar = false; pintaEscolhas(); if (P.fn && FN[P.fn].acao && (P.fn === 'status')) executaAcao('status'); return; }
  if ('enviaCel' in t.dataset) { if (P.fn && FN[P.fn].acao) executaAcao(P.fn); else { const d = $('#aviso'); envia().then(() => { if (d && d.innerHTML) d.scrollIntoView({ behavior: 'smooth', block: 'center' }); }); } return; }
  if (t.id === 'btn-enviar') { if (P.fn && FN[P.fn].acao) executaAcao(P.fn); else envia(); return; }
  if ('forcar' in t.dataset) { P.forcar = !P.forcar; pintaAviso(P.cli && P.fn ? jaExiste(P.cli, P.fn) : []); return; }
  if (t.dataset.ver) { FILTRO = 'abertos'; setTimeout(() => { const el = document.getElementById('ped-' + t.dataset.ver); el && el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 450); return; }
  if (t.dataset.filtro) { FILTRO = t.dataset.filtro; redesenha(); return; }
  if ('atualizar' in t.dataset) { t.disabled = true; await carrega(); if (tela() === 'resultados') await carregaAprov(); redesenha(); toast(ERRO || 'Atualizado.'); return; }
  if (t.dataset.aprovar) { const id = t.dataset.aprovar; if (await muda(d => { const x = d.itens.find(y => y.id === id); if (x) { x.st = 'aprovado'; x.atualizado = agora(); x.aprovadoEm = agora(); } })) { toast('Aprovado.'); redesenha(); } return; }
  if (t.dataset.cancelar) { const id = t.dataset.cancelar; if (!confirm('Cancelar este pedido? Ele sai da fila.')) return; if (await muda(d => { d.itens = d.itens.filter(y => y.id !== id || y.st !== 'novo'); })) { toast('Pedido cancelado.'); redesenha(); } return; }
  if (t.dataset.ajuste) { abreAjuste(t.dataset.ajuste); return; }
});
document.addEventListener('submit', e => { if (e.target.id !== 'escrever') return; e.preventDefault(); const i = e.target.querySelector('input'), v = i.value.trim(); if (!v) return; i.value = ''; processa(v); });

// janela "Pedir ajuste": fala ou escreve a nota; o pedido volta para a fila (st 'ajuste') e a conta que fez pega de novo
function abreAjuste(id) {
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="caixa" role="dialog" aria-modal="true" aria-label="Pedir ajuste"><h3>Pedir ajuste</h3><p class="sub" style="margin:0;color:var(--apagado)">Fale ou escreva o que mudar. O pedido volta para a fila com esta nota.</p>
    <textarea class="detalhe" id="nota-aj" maxlength="500" placeholder="Ex.: trocar a foto da capa e deixar o título maior"></textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${SR ? `<button class="btn lin" type="button" id="aj-voz">${I.mic}Falar</button>` : ''}<button class="btn lin" type="button" id="aj-sair" style="margin-left:auto">Voltar</button><button class="btn am" type="button" id="aj-ok">Pedir ajuste</button></div></div>`;
  document.body.appendChild(m); const ta = m.querySelector('#nota-aj'); setTimeout(() => ta.focus(), 50);
  const fecha = () => m.remove();
  m.addEventListener('click', ev => { if (ev.target === m) fecha(); });
  m.querySelector('#aj-sair').onclick = fecha;
  const v = m.querySelector('#aj-voz'); if (v) v.onclick = () => { const r = new SR(); r.lang = 'pt-BR'; r.onresult = ev => { ta.value = (ta.value + ' ' + ev.results[0][0].transcript).trim(); }; r.onend = () => v.textContent = 'Falar'; v.textContent = '● ouvindo…'; r.start(); };
  m.querySelector('#aj-ok').onclick = async () => { const nota = ta.value.trim().slice(0, 500); if (!nota) { ta.focus(); return; }
    if (await muda(d => { const x = d.itens.find(y => y.id === id); if (x) { x.st = 'ajuste'; x.nota = nota; x.ajustes = (x.ajustes | 0) + 1; x.atualizado = agora(); } })) { fecha(); toast('Ajuste pedido. Voltou para a fila.'); redesenha(); } };
}

addEventListener('hashchange', () => { render(); if (tela() === 'resultados') carregaAprov().then(() => { if (tela() === 'resultados') redesenha(); }); });
menuLateral(); relogio(); setInterval(relogio, 1000);
render();
carrega().then(() => { redesenha(); if (tela() === 'resultados') carregaAprov().then(redesenha); });
setInterval(async () => { if (document.hidden || $('.modal')) return; const antes = VERSAO; await carrega(); if (VERSAO !== antes) redesenha(); }, 45000); // a fila muda quando as contas pegam e entregam
