<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estado Próprio ▲ · Lindson Almeida</title><meta name="robots" content="noindex">
<!-- Nome da comunidade: ESTADO PRÓPRIO ▲ (escolhido pelo Lindson em 04/11: "amei estado próprio"; nome do agente Maquiavel, Príncipe XIII e XXIV). Tela de acesso da área de membros (Builder Squad, 04/11/2026). Mesmo visual NEXUS aprovado da área (prototipo.html, conta Pedro):
     preto + amarelo #F5C518, Anton + Manrope + JetBrains Mono, foto do Lindson ocupando o lado direito. Abas: Entrar e Primeiro acesso. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#07090C;--s:#0E1116;--l:#1C2028;--t:#F5F3EE;--ap:#9AA0A8;--am:#F5C518;--er:#FF6B6B}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--p)}body{color:var(--t);font-family:Manrope,system-ui,sans-serif;min-height:100vh}
.ft{position:fixed;top:0;bottom:0;right:0;width:58%;background:url(/membros/img/ep-porta.jpg) 50% 50%/cover;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 35%);mask-image:linear-gradient(90deg,transparent 0,#000 35%)}
.vel{position:fixed;inset:0;background:linear-gradient(90deg,rgba(7,9,12,.97) 0%,rgba(7,9,12,.8) 34%,rgba(7,9,12,.08) 66%),radial-gradient(40% 50% at 78% 35%,rgba(245,170,20,.16),transparent 70%)}
.cx{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 56px;max-width:560px}
.logo{white-space:nowrap;font:500 18px 'JetBrains Mono',monospace;letter-spacing:.5em;margin-bottom:56px}.logo b{color:var(--am)}
.orig{font:500 13px 'JetBrains Mono',monospace;letter-spacing:.42em;color:#cfd3d8}.orig b{color:var(--am)}
h1{font:400 84px/.9 Anton,Impact,sans-serif;text-transform:uppercase;margin:18px 0 26px}h1 span{display:block;font-size:.62em;color:var(--am)}
.tabs{display:flex;gap:6px;background:var(--s);border:1px solid var(--l);border-radius:99px;padding:5px;margin-bottom:20px;width:max-content}
.tabs button{border:0;background:none;color:#c9cdd3;font:700 14px Manrope;padding:10px 18px;border-radius:99px;cursor:pointer}.tabs button[aria-selected=true]{background:var(--am);color:#111}
form{display:grid;gap:12px}label{font:600 12px 'JetBrains Mono',monospace;letter-spacing:.14em;color:var(--ap);text-transform:uppercase}
input{width:100%;margin-top:6px;background:rgba(14,17,22,.9);border:1px solid var(--l);border-radius:12px;padding:14px 16px;color:var(--t);font:500 16px Manrope;outline:0}input:focus{border-color:var(--am)}
.bt{margin-top:8px;border:0;border-radius:99px;padding:15px 30px;font:800 16px Manrope;background:var(--am);color:#111;cursor:pointer;box-shadow:0 10px 30px rgba(245,197,24,.3)}.bt[disabled]{opacity:.6;cursor:wait}
.msg{min-height:22px;font:600 14px Manrope;color:var(--er)}.dica{font:500 13px/1.5 Manrope;color:var(--ap)}[hidden]{display:none!important}
@media(max-width:900px){.ft{width:100%;background-position:62% 10%;-webkit-mask-image:none;mask-image:none;opacity:.55}.vel{background:linear-gradient(0deg,var(--p) 40%,rgba(7,9,12,.6) 75%,rgba(7,9,12,.3))}
 .cx{padding:28px 16px;justify-content:flex-end}.logo{margin-bottom:28px}h1{font-size:58px}.tabs{width:100%}.tabs button{flex:1}}
</style></head><body>
<div class="ft" aria-hidden="true"></div><div class="vel" aria-hidden="true"></div>
<div class="cx">
 <div class="logo">ESTADO PRÓPRIO <b>▲</b></div>
 <div class="orig">A COMUNIDADE DE <b>LINDSON ALMEIDA</b></div>
 <h1>Cliente que vem<span>de você, não da sorte.</span></h1>
 <div class="tabs" role="tablist"><button role="tab" id="t-entrar" aria-selected="true">Entrar</button><button role="tab" id="t-primeiro" aria-selected="false">Primeiro acesso</button></div>
 <form id="f-entrar" autocomplete="on">
  <label>E-mail<input name="email" type="email" autocomplete="email" required maxlength="120"></label>
  <label>Senha<input name="senha" type="password" autocomplete="current-password" required maxlength="200"></label>
  <div class="msg" role="alert"></div><button class="bt" type="submit">Entrar</button>
  <p class="dica">Comprou agora? Use a aba <b>Primeiro acesso</b> com o e-mail e o CPF da compra.</p>
 </form>
 <form id="f-primeiro" hidden autocomplete="on">
  <label>E-mail da compra<input name="email" type="email" autocomplete="email" required maxlength="120"></label>
  <label>CPF da compra<input name="cpf" inputmode="numeric" autocomplete="off" required maxlength="18" placeholder="só os números"></label>
  <label>Crie uma senha<input name="senha" type="password" autocomplete="new-password" required minlength="8" maxlength="200" placeholder="pelo menos 8 caracteres"></label>
  <div class="msg" role="alert"></div><button class="bt" type="submit">Criar senha e entrar</button>
  <p class="dica">O CPF serve só para confirmar que a compra é sua. Ele não fica guardado em texto.</p>
 </form>
</div>
<script>
const $=s=>document.querySelector(s);
function aba(qual){['entrar','primeiro'].forEach(n=>{$('#t-'+n).setAttribute('aria-selected',n===qual);$('#f-'+n).hidden=n!==qual})}
$('#t-entrar').onclick=()=>aba('entrar');$('#t-primeiro').onclick=()=>aba('primeiro');
if(location.hash==='#primeiro')aba('primeiro');
async function envia(form,url){const msg=form.querySelector('.msg'),bt=form.querySelector('.bt');msg.textContent='';
 const d=Object.fromEntries(new FormData(form));if(d.cpf!==undefined){d.cpf=d.cpf.replace(/\D/g,'');if(d.cpf.length!==11&&d.cpf.length!==14){msg.textContent='Digite o CPF com 11 números.';return}}
 if(d.senha&&url.endsWith('primeiro')&&d.senha.length<8){msg.textContent='A senha precisa ter pelo menos 8 caracteres.';return}
 bt.disabled=true;
 try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d),credentials:'same-origin'});const j=await r.json().catch(()=>({}));
  if(r.ok&&j.ok){location.href='/membros/area';return}msg.textContent=j.erro||'Não deu certo. Tente de novo.'}
 catch(e){msg.textContent='Sem conexão. Tente de novo.'}finally{bt.disabled=false}}
$('#f-entrar').onsubmit=e=>{e.preventDefault();envia(e.target,'/api/membros/entrar')};
$('#f-primeiro').onsubmit=e=>{e.preventDefault();envia(e.target,'/api/membros/primeiro')};
</script></body></html>
