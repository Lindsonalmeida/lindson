<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Vídeo de apresentação do Dublê, 30 s, 1080×1920 (conta Pedro, 03/11/2026). Composição da tela v2
     aprovada (template Sermo): halo de raios que reage à voz, selo em pílula, legenda gigante em 2 tons,
     aviso flutuante. Voz: clone da voz do Lindson (Dublê). Foto dele no cantinho com o selo "Clone". -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#060608;--g:#0B0B10;--pa:#15151C;--pa2:#1C1C25;--l:#2A2A35;--l2:#1E1E27;--pp:#F2F1EC;--ap:#9C9AAB;--fr:#6E6C7E;--eco:#8B7CFF;--selo:#F5C518;--ok:#5CC98A}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--p);color:var(--pp);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased}
canvas{position:absolute;inset:0}
.marca{position:absolute;top:150px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;border:2px solid var(--l2);background:rgba(11,11,16,.75);border-radius:999px;padding:18px 34px;font:500 44px 'Geist'}
.marca svg{width:46px;height:46px}
.pil{display:inline-flex;align-items:center;gap:14px;border:2px solid var(--l);background:rgba(21,21,28,.92);border-radius:999px;padding:12px 28px;font:500 32px 'Manrope'}
.pil svg{width:30px;height:30px;color:var(--eco)}
#selo{position:absolute;top:300px;left:0;right:0;text-align:center}
#leg{position:absolute;left:80px;right:80px;top:560px;height:720px;display:flex;align-items:center;justify-content:center;text-align:center}
#leg p{font:500 96px/1.06 'Geist';letter-spacing:-.045em;text-wrap:balance}
#leg p .b{color:var(--eco)}
.canto{position:absolute;right:70px;bottom:330px;display:flex;flex-direction:column;align-items:center;gap:18px}
.foto{position:relative;width:330px;height:330px}
.foto img{position:absolute;inset:14px;width:302px;height:302px;border-radius:50%;object-fit:cover;object-position:42% 50%}
.foto .anel{position:absolute;inset:0;border-radius:50%;border:6px solid var(--eco)}
.foto .anel2{position:absolute;inset:-14px;border-radius:50%;border:3px solid rgba(139,124,255,.45)}
.clone{font:600 30px 'Geist Mono';letter-spacing:.08em;color:var(--g);background:var(--eco);border-radius:999px;padding:10px 24px}
.voo{position:absolute;left:50%;transform:translateX(-50%);bottom:360px;display:flex;gap:20px;align-items:center;border:2px solid var(--l);background:rgba(16,16,22,.95);border-radius:26px;padding:16px 34px 16px 16px;width:720px}
.voo b{display:block;font-weight:600;font-size:32px}.voo small{color:var(--ap);font-size:26px;line-height:1.3;display:block}
.barras{display:flex;gap:6px;align-items:center;height:86px;padding:0 20px;border-radius:18px;background:var(--pa2)}
.barras i{width:7px;border-radius:4px;background:var(--eco)}
.ia{position:absolute;bottom:230px;left:0;right:0;text-align:center;color:var(--fr);font-size:28px}
#fim{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;text-align:center}
#fim svg{width:220px;height:220px}
#fim h1{font:500 130px/1 'Geist';letter-spacing:-.05em}
#fim h2{font:500 76px/1.05 'Geist';letter-spacing:-.04em}#fim h2 span{color:var(--fr)}
</style></head><body>
<canvas id="halo" width="1080" height="1920"></canvas>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="logo" viewBox="0 0 64 64"><path d="M30 12 A20 20 0 0 0 30 52 Z" fill="#F2F1EC"/><g fill="#8B7CFF"><rect x="33" y="12" width="5" height="40" rx="2.5"/><rect x="41" y="17" width="5" height="30" rx="2.5"/><rect x="49" y="24" width="5" height="16" rx="2.5"/></g></symbol>
<symbol id="barr" viewBox="0 0 16 16"><g fill="currentColor"><rect x="2" y="3" width="2" height="10" rx="1"/><rect x="6" y="5" width="2" height="6" rx="1"/><rect x="10" y="2" width="2" height="12" rx="1"/><rect x="14" y="6" width="1.6" height="4" rx=".8"/></g></symbol>
</defs></svg>
<div id="cena">
  <div class="marca" id="marca"><svg><use href="#logo"/></svg>dublê</div>
  <div id="selo"><span class="pil"><svg><use href="#barr"/></svg>CLONE · voz do Lindson, clonada pelo Claude</span></div>
  <div id="leg"><p id="frase"></p></div>
  <div class="voo" id="voo"><span class="barras" id="vb"></span><span><b>Essa voz não é gravada</b><small>É o clone da voz do Lindson,<br>feito com autorização dele.</small></span></div>
  <div class="canto" id="canto" hidden style="display:none"><div class="foto"><span class="anel2" id="anel2"></span><span class="anel" id="anel"></span><img src="rosto.jpg" alt=""></div><span class="clone">CLONE</span></div>
  <div class="ia" id="ia">Feito com IA · voz clonada do Lindson, com autorização</div>
</div>
<div id="fim" style="opacity:0"><svg><use href="#logo"/></svg><h1>dublê</h1><h2>Sua voz, seu rosto.<br><span>Só com o seu sim.</span></h2><span class="pil">Feito com IA · uso interno</span></div>
<script src="envelope.js"></script>
<script>
const $=id=>document.getElementById(id);
const ATRASO=1.0, DUR=30;
// frases com o tempo em que começam na voz (segundos, sem o atraso); "Claude" aparece escrito certo
const F=[[0,'Fala, pessoal, aqui é o <span class="b">Lindson</span>.'],[2.0,'Quer dizer…<br>mais ou menos.'],
 [3.6,'Essa voz é minha, mas quem está falando agora é <span class="b">um clone</span>.'],
 [6.6,'Eu sou o clone do Lindson, feito pelo <span class="b">Claude</span>,'],[8.7,'dentro do <span class="b">Dublê</span>, o nosso estúdio de voz e imagem.'],
 [11.2,'O Dublê clona a sua voz e o seu rosto,'],[13.8,'mas só de quem <span class="b">autorizou</span>, com termo assinado e vídeo de consentimento.'],
 [17.6,'E aí, você teria <span class="b">um clone</span>?'],[19.3,'Me conta aqui embaixo.'],
 [20.5,'Quer um clone de voz pra sua marca?'],[22.7,'Fala com o Lindson.<br><span class="b">O de verdade.</span>']];
const ENV=window.ENVJ;window.pronto=true;
let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const R=Array.from({length:300},(_,i)=>({a:i/300*Math.PI*2,L:.25+rnd()**1.6*.75,f:.5+rnd(),p:rnd()*6.28,b:rnd()<.2}));
const cx=$('halo').getContext('2d');
function halo(t,A,y0r){cx.clearRect(0,0,1080,1920);const x0=540,y0=1920*y0r;
 const g=cx.createRadialGradient(x0,y0,0,x0,y0,760);g.addColorStop(0,`rgba(139,124,255,${.08+A*.12})`);g.addColorStop(1,'rgba(139,124,255,0)');cx.fillStyle=g;cx.fillRect(0,0,1080,1920);
 for(const r of R){const len=380*r.L*(.72+.28*Math.sin(t*r.f*2+r.p))*(1+A*.9),ini=330*(1-A*.04);const ca=Math.cos(r.a),sa=Math.sin(r.a);
  for(let d=0;d<len;d+=11){const q=d/len,al=(1-q)**1.2*(r.b?1:.68)*(.7+A*.3);cx.strokeStyle=r.b&&q<.5?`rgba(196,188,255,${al})`:`rgba(139,124,255,${al})`;
   cx.lineWidth=r.b?3:2.2;cx.beginPath();cx.moveTo(x0+ca*(ini+d),y0+sa*(ini+d));cx.lineTo(x0+ca*(ini+d+5),y0+sa*(ini+d+5));cx.stroke()}}}
const ease=x=>1-(1-Math.min(1,Math.max(0,x)))**3;
$('vb').innerHTML='<i></i>'.repeat(9);
let ultima=-1;
window.desenha=function(t){
 const tv=t-ATRASO, k=Math.floor(tv*25), A=(tv>=0&&k<ENV.length)?ENV[k]:0;
 const fimIni=ATRASO+25.4, ef=ease((t-fimIni)/.6);
 halo(t,A,ef>0?.5:.44);
 $('cena').style.opacity=1-ef;$('fim').style.opacity=ef;$('fim').style.transform=`scale(${.96+.04*ef})`;
 const e0=ease(t/.5);$('marca').style.opacity=e0;
 // frase atual
 let i=-1;for(let j=0;j<F.length;j++)if(tv>=F[j][0]-.05)i=j;
 if(i!==ultima){$('frase').innerHTML=i>=0?F[i][1]:'';ultima=i}
 const ini=i>=0?F[i][0]:0,ef2=ease((tv-ini+.05)/.25);$('frase').style.cssText=`opacity:${i>=0?ef2:0};transform:translateY(${(1-ef2)*24}px)`;
 // selo e aviso aparecem quando ele diz que a voz é dele
 const es=ease((tv-3.5)/.4);$('selo').style.cssText=`opacity:${es};transform:translateY(${(1-es)*-16}px)`;
 const ev=ease((tv-4.0)/.4)*(1-ease((tv-11.0)/.4));$('voo').style.cssText=`opacity:${ev};transform:translate(-50%,${(1-ev)*24}px)`;
 document.querySelectorAll('#vb i').forEach((el,j)=>el.style.height=(18+70*A*(.6+.4*Math.abs(Math.sin(j*1.3+t*6))))+'%');
 const ec=ease((tv+.4)/.5);
 $('anel').style.transform=`scale(${1+A*.05})`;$('anel2').style.cssText=`transform:scale(${1+A*.12});opacity:${.25+A*.75}`;
 $('ia').style.opacity=ease((tv)/.5);
};
document.fonts.ready.then(()=>{});
</script></body></html>
